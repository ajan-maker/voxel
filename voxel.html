
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VOXEL</title>

<style>
* {
 box-sizing: border-box;
}

html, body {
 margin: 0;
 width: 100%;
 height: 100%;
 overflow: hidden;
 font-family: Arial, sans-serif;
 background: #000;
 color: white;
}

button {
 padding: 10px 13px;
 background: #222d;
 border: 1px solid #ffffff66;
 color: white;
 border-radius: 6px;
 cursor: pointer;
 font-weight: bold;
}

button:hover {
 filter: brightness(1.2);
}

input {
 font-family: Arial, sans-serif;
}

/* MAIN MENU */

#overlay {
 position: fixed;
 inset: 0;
 z-index: 20;
 display: flex;
 align-items: center;
 justify-content: center;
 background-color: #777;
 background-image:
  linear-gradient(#0002 1px, transparent 1px),
  linear-gradient(90deg, #0002 1px, transparent 1px);
 background-size: 32px 32px;
}

#panel {
 width: min(700px, 95%);
 padding: 20px;
 text-align: center;
}

#panel h1 {
 color: black;
 font-size: clamp(55px, 9vw, 100px);
 font-weight: 900;
 letter-spacing: 10px;
 margin: 0 0 35px;
 text-shadow: 2px 2px 0 #aaa;
}

#panel .menu-button {
 display: block;
 width: 100%;
 min-height: 115px;
 margin: 0 auto 24px;
 padding: 15px;
 color: black;
 background-color: #a66d48;
 background-image:
  linear-gradient(#ffffff0c 1px, transparent 1px),
  linear-gradient(90deg, #00000018 1px, transparent 1px);
 background-size: 16px 16px;
 border: 3px solid #805132;
 border-radius: 0;
 font-size: clamp(25px, 5vw, 48px);
 font-weight: 400;
}

#panel .menu-button:hover {
 background-color: #bd8259;
}

/* UPDATING SCREEN */

#updatingScreen {
 display: none;
 position: fixed;
 inset: 0;
 z-index: 100;
 background: #000;
 color: white;
 align-items: center;
 justify-content: center;
 flex-direction: column;
 gap: 28px;
 text-align: center;
}

#updatingText {
 font-size: clamp(20px, 5vw, 38px);
 font-weight: 900;
 letter-spacing: 3px;
 padding: 0 15px;
}

#updatingBack {
 min-width: 180px;
 min-height: 55px;
 background: #222;
 color: white;
 border: 2px solid #777;
 border-radius: 0;
 font-size: 20px;
 font-weight: 900;
}

/* CODE MACHINE */

#codeMachine {
 position: absolute;
 right: 18px;
 bottom: 18px;
 width: min(330px, calc(100vw - 24px));
 padding: 12px;
 background: #242424ee;
 border: 2px solid #111;
 box-shadow: 4px 4px 0 #0005;
 color: white;
 text-align: left;
 z-index: 25;
}

#codeMachineTitle {
 margin-bottom: 9px;
 font-size: 14px;
 font-weight: 900;
 letter-spacing: 2px;
}

#codeMachineRow {
 display: flex;
 gap: 7px;
}

#codeMachineInput {
 flex: 1;
 min-width: 0;
 height: 40px;
 padding: 0 10px;
 background: #111;
 color: white;
 border: 2px solid #777;
 border-radius: 0;
 outline: none;
 font-size: 15px;
}

#codeMachineCheck {
 width: 44px;
 min-width: 44px;
 height: 40px;
 padding: 0;
 border: 2px solid #6b9561;
 border-radius: 0;
 background: #387b35;
 color: white;
 font-size: 25px;
}

/* NORMAL VERITY */

#verityButton {
 position: absolute;
 top: 18px;
 right: 18px;
 display: none;
 padding: 14px 25px;
 background: #ffdf32;
 color: #171717;
 border: 3px solid #b99b00;
 border-radius: 0;
 font-size: 20px;
 font-weight: 900;
 letter-spacing: 2px;
 z-index: 30;
}

#verityPanel {
 display: none;
 position: absolute;
 top: 50%;
 left: 50%;
 transform: translate(-50%, -50%);
 width: min(440px, 90vw);
 padding: 22px;
 background: #ffdf32;
 border: 4px solid #b99b00;
 box-shadow: 8px 8px 0 #0005;
 color: #171717;
 text-align: left;
 z-index: 31;
}

#verityHeader,
#adminVerityHeader,
#commandsHeader,
#questsLoginHeader,
#questsResultHeader {
 display: flex;
 justify-content: space-between;
 align-items: center;
 gap: 10px;
 margin-bottom: 18px;
 font-size: 22px;
 font-weight: 900;
 letter-spacing: 2px;
}

#verityRow,
#commandInputRow {
 display: flex;
 gap: 8px;
}

#verityInput,
#commandInput {
 flex: 1;
 min-width: 0;
 height: 44px;
 padding: 0 10px;
 background: #fff7bd;
 color: #171717;
 border: 3px solid #b99b00;
 border-radius: 0;
 outline: none;
 font-size: 15px;
}

#veritySend,
#commandCheck {
 width: 48px;
 min-width: 48px;
 height: 44px;
 padding: 0;
 background: #222;
 color: white;
 border: 2px solid #111;
 border-radius: 0;
 font-size: 24px;
}

#verityClose,
#adminVerityClose,
#commandsClose,
#questsClose,
#questsResultClose {
 width: 40px;
 height: 40px;
 padding: 0;
 background: #222;
 color: white;
 border: 2px solid #111;
 border-radius: 0;
 font-size: 22px;
 flex-shrink: 0;
}

#verityResponse,
#adminVerityStatus,
#commandResponse {
 min-height: 42px;
 margin-top: 16px;
 padding: 10px;
 background: #f7d52a;
 border: 2px solid #b99b00;
 color: #171717;
 font-weight: 900;
 overflow-wrap: anywhere;
}

/* ADMIN LOGIN */

#adminPanel {
 display: none;
 position: absolute;
 top: 50%;
 left: 50%;
 transform: translate(-50%, -50%);
 width: min(390px, 92vw);
 padding: 22px;
 background: #080808;
 color: white;
 border: 3px solid #555;
 box-shadow: 8px 8px 0 #0007;
 z-index: 45;
}

#adminTitle {
 font-size: 22px;
 font-weight: 900;
 letter-spacing: 3px;
 margin-bottom: 18px;
}

.adminLabel {
 display: block;
 font-size: 12px;
 letter-spacing: 2px;
 font-weight: bold;
 margin: 12px 0 6px;
}

.adminInput,
#adminCodeInput {
 width: 100%;
 height: 42px;
 padding: 0 10px;
 background: #171717;
 color: white;
 border: 2px solid #555;
 border-radius: 0;
 outline: none;
 font-size: 15px;
}

#adminLoginButton,
#adminCodeButton {
 width: 100%;
 height: 42px;
 margin-top: 14px;
 background: #eee;
 color: #111;
 border: 2px solid #999;
 border-radius: 0;
 font-weight: 900;
}

#adminError,
#adminCodeMessage {
 min-height: 20px;
 margin-top: 12px;
 color: #ff5b5b;
 font-size: 12px;
 font-weight: bold;
 overflow-wrap: anywhere;
}

#adminCodeSection {
 display: none;
 margin-top: 20px;
 padding-top: 18px;
 border-top: 1px solid #555;
}

#adminClose {
 position: absolute;
 top: 10px;
 right: 10px;
 width: 30px;
 height: 30px;
 padding: 0;
 background: #222;
 border: 1px solid #777;
 border-radius: 0;
}

/* ADMIN VERITY */

#adminVerityPanel,
#commandsPanel {
 display: none;
 position: absolute;
 top: 50%;
 left: 50%;
 transform: translate(-50%, -50%);
 width: min(470px, 92vw);
 padding: 22px;
 background: #ffdf32;
 color: #171717;
 border: 4px solid #b99b00;
 box-shadow: 8px 8px 0 #0005;
 z-index: 46;
}

#commandsPanel {
 z-index: 47;
}

#commandsButton {
 width: 100%;
 min-height: 44px;
 background: #222;
 color: white;
 border: 2px solid #111;
 border-radius: 0;
 font-weight: 900;
 letter-spacing: 2px;
}

#commandList {
 padding: 12px;
 background: #f7d52a;
 border: 2px solid #b99b00;
 color: #171717;
 font-weight: 900;
}

#commandList div {
 margin: 5px 0;
}

#commandInputRow {
 margin-top: 12px;
}

#moreComing {
 margin-top: 15px;
 text-align: center;
 font-size: 13px;
 font-weight: 900;
 letter-spacing: 2px;
}

/* HALLOWEEN EVENT */

#halloweenPanel {
 display: none;
 position: absolute;
 top: 50%;
 left: 50%;
 transform: translate(-50%, -50%);
 width: min(430px, 90vw);
 padding: 26px;
 text-align: center;
 color: white;
 background: linear-gradient(
  135deg,
  #ff7a00 0%,
  #ff7a00 48%,
  #7026a8 52%,
  #35104f 100%
 );
 border: 4px solid #ffb14a;
 box-shadow: 9px 9px 0 #0008;
 z-index: 48;
}

#halloweenTitle {
 font-size: clamp(27px, 6vw, 42px);
 font-weight: 900;
 letter-spacing: 4px;
 margin: 4px 0 25px;
 text-shadow: 3px 3px 0 #35104f;
}

#summonButton {
 width: 100%;
 min-height: 54px;
 background: #999;
 color: #171717;
 border: 3px solid #555;
 border-radius: 0;
 font-size: 20px;
 font-weight: 900;
 letter-spacing: 3px;
}

/* QUESTS */

#questsButton {
 position: absolute;
 right: 18px;
 bottom: 166px;
 width: min(330px, calc(100vw - 24px));
 min-height: 44px;
 padding: 10px;
 background: #a88953;
 color: #17120a;
 border: 2px solid #6f5730;
 border-radius: 0;
 font-size: 16px;
 font-weight: 900;
 letter-spacing: 2px;
 z-index: 26;
}

#questsLoginPanel,
#questsResultPanel {
 display: none;
 position: absolute;
 top: 50%;
 left: 50%;
 transform: translate(-50%, -50%);
 width: min(400px, 90vw);
 padding: 22px;
 background: #c9ad7a;
 color: #21190d;
 border: 4px solid #8b7045;
 box-shadow: 8px 8px 0 #0005;
 z-index: 52;
}

#questsResultPanel {
 text-align: center;
 min-height: 180px;
}

#questsResultHeader {
 margin-bottom: 35px;
 font-size: 22px;
 letter-spacing: 2px;
}

#questUserInput {
 width: 100%;
 height: 44px;
 padding: 0 10px;
 background: #f1e2c3;
 color: #21190d;
 border: 3px solid #8b7045;
 border-radius: 0;
 outline: none;
 font-size: 15px;
}

#checkQuestsButton {
 width: 100%;
 min-height: 46px;
 margin-top: 12px;
 background: #80643b;
 color: white;
 border: 3px solid #5e4728;
 border-radius: 0;
 font-weight: 900;
 letter-spacing: 1px;
}

#questsMessage {
 margin-top: 12px;
 min-height: 20px;
 font-size: 12px;
 font-weight: 900;
 overflow-wrap: anywhere;
}

#questsResultText {
 font-size: 19px;
 font-weight: 900;
 letter-spacing: 1px;
}

/* MESSAGE */

#message {
 position: fixed;
 top: 25px;
 left: 50%;
 transform: translateX(-50%);
 padding: 8px 15px;
 background: #222;
 border: 1px solid #777;
 opacity: 0;
 transition: opacity .2s;
 pointer-events: none;
 z-index: 110;
 white-space: nowrap;
}

@media (max-width: 800px) {
 #panel .menu-button {
  min-height: 75px;
  margin-bottom: 18px;
 }

 #panel h1 {
  margin-bottom: 25px;
 }

 #codeMachine {
  right: 8px;
  bottom: 8px;
  width: min(290px, calc(100vw - 16px));
 }

 #verityButton {
  top: 10px;
  right: 10px;
  padding: 10px 14px;
  font-size: 15px;
 }

 #adminPanel,
 #adminVerityPanel,
 #commandsPanel {
  padding: 17px;
 }

 #questsButton {
  right: 8px;
  bottom: 166px;
  width: min(290px, calc(100vw - 16px));
 }
}
</style>
</head>

<body>

<div id="message"></div>

<!-- MAIN MENU -->

<div id="overlay">

 <div id="panel">
  <h1>VOXEL</h1>
  <button id="play" class="menu-button" type="button">JOIN WORLD</button>
  <button id="backBtn" class="menu-button" type="button">BACK</button>
 </div>

 <!-- CODE MACHINE -->

 <div id="codeMachine">
  <div id="codeMachineTitle">CODE MACHINE</div>
  <div id="codeMachineRow">
   <input id="codeMachineInput" type="text"
    placeholder="Enter code..." autocomplete="off"
    spellcheck="false" aria-label="Enter code">
   <button id="codeMachineCheck" type="button" aria-label="Check code">✓</button>
  </div>
 </div>

 <!-- NORMAL VERITY -->

 <button id="verityButton" type="button">VERITY</button>

 <div id="verityPanel">
  <div id="verityHeader">
   <span>VERITY</span>
   <button id="verityClose" type="button">X</button>
  </div>

  <div id="verityRow">
   <input id="verityInput" type="text"
    placeholder="Type something..." autocomplete="off"
    spellcheck="false" aria-label="Message to Verity">
   <button id="veritySend" type="button">✓</button>
  </div>

  <div id="verityResponse">VERITY IS LISTENING...</div>
 </div>

 <!-- ADMIN LOGIN -->

 <div id="adminPanel">
  <button id="adminClose" type="button">X</button>
  <div id="adminTitle">ADMIN LOGIN</div>

  <label class="adminLabel" for="adminUser">USER</label>
  <input class="adminInput" id="adminUser" type="text"
   placeholder="Enter user" autocomplete="off" spellcheck="false">

  <label class="adminLabel" for="adminPassword">PASSWORD</label>
  <input class="adminInput" id="adminPassword" type="password"
   placeholder="Enter password" autocomplete="off">

  <button id="adminLoginButton" type="button">LOGIN</button>
  <div id="adminError" aria-live="polite"></div>

  <div id="adminCodeSection">
   <label class="adminLabel" for="adminCodeInput">ENTER CODE</label>
   <input id="adminCodeInput" type="text"
    placeholder="Enter code..." autocomplete="off" spellcheck="false">
   <button id="adminCodeButton" type="button">ENTER / CODE</button>
   <div id="adminCodeMessage" aria-live="polite"></div>
  </div>
 </div>

 <!-- ADMIN VERITY -->

 <div id="adminVerityPanel">
  <div id="adminVerityHeader">
   <span>VERITY</span>
   <button id="adminVerityClose" type="button">X</button>
  </div>

  <button id="commandsButton" type="button">COMMANDS</button>
  <div id="adminVerityStatus">VERITY IS LISTENING...</div>
 </div>

 <!-- COMMANDS -->

 <div id="commandsPanel">
  <div id="commandsHeader">
   <span>VERITY COMMANDS</span>
   <button id="commandsClose" type="button">X</button>
  </div>

  <div id="commandList">
   <div>/SAY.HI</div>
  </div>

  <div id="commandInputRow">
   <input id="commandInput" type="text"
    placeholder="Enter command..." autocomplete="off" spellcheck="false">
   <button id="commandCheck" type="button">✓</button>
  </div>

  <div id="commandResponse">ENTER A COMMAND</div>
  <div id="moreComing">MORE COMING SOON...</div>
 </div>

 <!-- HALLOWEEN -->

 <video id="halloweenMusic" src="./halloween.mp4"
  preload="auto" playsinline loop style="display:none"></video>

 <div id="halloweenPanel">
  <div id="halloweenTitle">HALLOWEEN</div>
  <button id="summonButton" type="button">SUMMON</button>
 </div>

 <!-- QUESTS LOGIN -->

 <div id="questsLoginPanel">
  <div id="questsLoginHeader">
   <span>ENTER QUEST USER</span>
   <button id="questsClose" type="button">X</button>
  </div>

  <input id="questUserInput" type="text"
   placeholder="Enter quest user..." autocomplete="off"
   spellcheck="false" aria-label="Enter quest user">

  <button id="checkQuestsButton" type="button">CHECK QUESTS</button>
  <div id="questsMessage" aria-live="polite"></div>
 </div>

 <!-- QUESTS RESULT -->

 <div id="questsResultPanel">
  <div id="questsResultHeader">
   <span>QUESTS</span>
   <button id="questsResultClose" type="button">X</button>
  </div>

  <div id="questsResultText">NO QUESTS AVAILABLE</div>
 </div>

 <button id="questsButton" type="button">QUESTS</button>

</div>

<!-- THIS SCREEN IS OUTSIDE THE MENU SO IT CAN BE SHOWN INDEPENDENTLY -->

<div id="updatingScreen">
 <div id="updatingText">GAME CURENTYLY UPDATIN</div>
 <button id="updatingBack" type="button">BACK</button>
</div>

<script>
"use strict";

// =====================
// BASIC UI
// =====================

const overlay = document.getElementById("overlay");
const updatingScreen = document.getElementById("updatingScreen");
const messageElement = document.getElementById("message");

let messageTimeout = null;
let halloweenTimer = null;
let halloweenOriginalBackground = null;

function showMessage(text) {
 messageElement.textContent = text;
 messageElement.style.opacity = "1";

 clearTimeout(messageTimeout);

 messageTimeout = setTimeout(() => {
  messageElement.style.opacity = "0";
 }, 1800);
}

// =====================
// SECRET PANEL REFERENCES
// =====================

const codeMachineInput = document.getElementById("codeMachineInput");
const codeMachineCheck = document.getElementById("codeMachineCheck");

const verityButton = document.getElementById("verityButton");
const verityPanel = document.getElementById("verityPanel");
const verityClose = document.getElementById("verityClose");
const verityInput = document.getElementById("verityInput");
const veritySend = document.getElementById("veritySend");
const verityResponse = document.getElementById("verityResponse");

const adminPanel = document.getElementById("adminPanel");
const adminClose = document.getElementById("adminClose");
const adminUser = document.getElementById("adminUser");
const adminPassword = document.getElementById("adminPassword");
const adminLoginButton = document.getElementById("adminLoginButton");
const adminError = document.getElementById("adminError");
const adminCodeSection = document.getElementById("adminCodeSection");
const adminCodeInput = document.getElementById("adminCodeInput");
const adminCodeButton = document.getElementById("adminCodeButton");
const adminCodeMessage = document.getElementById("adminCodeMessage");

const adminVerityPanel = document.getElementById("adminVerityPanel");
const adminVerityClose = document.getElementById("adminVerityClose");
const commandsButton = document.getElementById("commandsButton");
const adminVerityStatus = document.getElementById("adminVerityStatus");

const commandsPanel = document.getElementById("commandsPanel");
const commandsClose = document.getElementById("commandsClose");
const commandInput = document.getElementById("commandInput");
const commandCheck = document.getElementById("commandCheck");
const commandResponse = document.getElementById("commandResponse");

const halloweenPanel = document.getElementById("halloweenPanel");
const summonButton = document.getElementById("summonButton");
const halloweenMusic = document.getElementById("halloweenMusic");

const questsButton = document.getElementById("questsButton");
const questsLoginPanel = document.getElementById("questsLoginPanel");
const questsClose = document.getElementById("questsClose");
const questUserInput = document.getElementById("questUserInput");
const checkQuestsButton = document.getElementById("checkQuestsButton");
const questsMessage = document.getElementById("questsMessage");
const questsResultPanel = document.getElementById("questsResultPanel");
const questsResultClose = document.getElementById("questsResultClose");

// =====================
// CLOSE SECRET PANELS
// =====================

function closeAllSecretPanels() {
 verityPanel.style.display = "none";
 adminPanel.style.display = "none";
 adminVerityPanel.style.display = "none";
 commandsPanel.style.display = "none";
 halloweenPanel.style.display = "none";
 questsLoginPanel.style.display = "none";
 questsResultPanel.style.display = "none";
}

// =====================
// JOIN WORLD / BACK
// =====================

// JOIN WORLD opens the black update screen.
// There is no 3D world, block system, keyboard movement,
// or mobile movement system in this version.

document.getElementById("play").addEventListener("click", () => {
 stopHalloweenEvent();
 closeAllSecretPanels();

 overlay.style.display = "none";
 updatingScreen.style.display = "flex";
});

document.getElementById("updatingBack").addEventListener("click", () => {
 updatingScreen.style.display = "none";
 overlay.style.display = "flex";
});

document.getElementById("backBtn").addEventListener("click", () => {
 window.location.href = "index.html";
});

// =====================
// CODE MACHINE
// =====================

function openAdminPanel() {
 closeAllSecretPanels();

 adminPanel.style.display = "block";
 adminError.textContent = "";
 adminCodeMessage.textContent = "";
 adminCodeSection.style.display = "none";

 adminUser.value = "";
 adminPassword.value = "";
 adminCodeInput.value = "";

 adminUser.focus();
}

function checkCode() {
 const enteredCode = codeMachineInput.value.trim().toUpperCase();

 if (enteredCode === "ADMIN" || enteredCode === "OPERATOR") {
  codeMachineInput.value = "";
  openAdminPanel();
  return;
 }

 if (enteredCode === "VERITY.UNMODED") {
  verityButton.style.display = "block";
  verityPanel.style.display = "none";
  codeMachineInput.value = "";
  showMessage("VERITY UNLOCKED!");
  return;
 }

 showMessage("INVALID CODE");
}

codeMachineCheck.addEventListener("click", checkCode);

codeMachineInput.addEventListener("keydown", event => {
 if (event.key === "Enter") {
  event.preventDefault();
  checkCode();
 }
});

// =====================
// ADMIN LOGIN
// =====================

function checkAdminLogin() {
 const user = adminUser.value.trim();
 const password = adminPassword.value;

 if (
  user === "COOLEST-Q45K0" &&
  password === "#4TZ/OP/COOLEST-Q45K0"
 ) {
  adminError.textContent = "";
  adminCodeSection.style.display = "block";
  adminCodeMessage.textContent = "";
  adminCodeInput.value = "";
  adminCodeInput.focus();
 } else {
  adminError.textContent = "PASSWORD AND USER INCORRECT";
  adminCodeSection.style.display = "none";
 }
}

adminLoginButton.addEventListener("click", checkAdminLogin);

adminUser.addEventListener("keydown", event => {
 if (event.key === "Enter") {
  event.preventDefault();
  adminPassword.focus();
 }
});

adminPassword.addEventListener("keydown", event => {
 if (event.key === "Enter") {
  event.preventDefault();
  checkAdminLogin();
 }
});

adminClose.addEventListener("click", () => {
 adminPanel.style.display = "none";
});

// =====================
// ADMIN CODES
// =====================

function checkAdminCode() {
 const code = adminCodeInput.value.trim().toUpperCase();

 if (code === "/HALLOWEEN.EVENT") {
  adminPanel.style.display = "none";
  adminVerityPanel.style.display = "none";
  commandsPanel.style.display = "none";
  halloweenPanel.style.display = "block";

  adminCodeMessage.textContent = "";
  adminCodeInput.value = "";

 } else if (code === "VERITY.MODED") {
  adminPanel.style.display = "none";
  adminVerityPanel.style.display = "block";
  commandsPanel.style.display = "none";

  adminVerityStatus.textContent = "VERITY IS LISTENING...";
  adminCodeMessage.textContent = "";
  adminCodeInput.value = "";

 } else {
  adminCodeMessage.textContent = "UNKNOWN CODE";
 }
}

adminCodeButton.addEventListener("click", checkAdminCode);

adminCodeInput.addEventListener("keydown", event => {
 if (event.key === "Enter") {
  event.preventDefault();
  checkAdminCode();
 }
});

// =====================
// HALLOWEEN EVENT
// =====================

function stopHalloweenEvent() {
 clearTimeout(halloweenTimer);
 halloweenTimer = null;

 halloweenMusic.pause();

 try {
  halloweenMusic.currentTime = 0;
 } catch (error) {
  console.warn("Could not reset Halloween video.", error);
 }

 if (halloweenOriginalBackground) {
  overlay.style.backgroundColor = halloweenOriginalBackground.color;
  overlay.style.backgroundImage = halloweenOriginalBackground.image;
  halloweenOriginalBackground = null;
 }
}

function summonHalloween() {
 halloweenPanel.style.display = "none";

 if (overlay.style.display === "none") {
  return;
 }

 stopHalloweenEvent();

 halloweenOriginalBackground = {
  color: overlay.style.backgroundColor,
  image: overlay.style.backgroundImage
 };

 overlay.style.backgroundColor = "#39204f";
 overlay.style.backgroundImage =
  "linear-gradient(#b78ad833 1px,transparent 1px)," +
  "linear-gradient(90deg,#b78ad833 1px,transparent 1px)";

 halloweenMusic.currentTime = 0;

 halloweenMusic.play().catch(error => {
  console.warn("Halloween video could not play:", error);
  showMessage("Could not play halloween.mp4");
 });

 halloweenTimer = setTimeout(() => {
  stopHalloweenEvent();
 }, 30000);
}

summonButton.addEventListener("click", summonHalloween);

// =====================
// NORMAL VERITY
// =====================

verityButton.addEventListener("click", () => {
 if (overlay.style.display === "none") {
  return;
 }

 closeAllSecretPanels();

 verityPanel.style.display = "block";
 verityInput.value = "";
 verityResponse.textContent = "VERITY IS LISTENING...";
 verityInput.focus();
});

verityClose.addEventListener("click", () => {
 verityPanel.style.display = "none";
});

function sendVerityMessage() {
 const message = verityInput.value.trim().toUpperCase();

 if (message === "/SAY.HI") {
  verityResponse.textContent = "HI ITS ME ITS VERITY";
 } else {
  verityResponse.textContent = "verity couldnt think";
 }
}

veritySend.addEventListener("click", sendVerityMessage);

verityInput.addEventListener("keydown", event => {
 if (event.key === "Enter") {
  event.preventDefault();
  sendVerityMessage();
 }
});

// =====================
// ADMIN VERITY SCREEN
// =====================

adminVerityClose.addEventListener("click", () => {
 adminVerityPanel.style.display = "none";
 commandsPanel.style.display = "none";
});

commandsButton.addEventListener("click", () => {
 adminVerityPanel.style.display = "none";
 commandsPanel.style.display = "block";

 commandInput.value = "";
 commandResponse.textContent = "ENTER A COMMAND";
 commandInput.focus();
});

commandsClose.addEventListener("click", () => {
 commandsPanel.style.display = "none";
 adminVerityPanel.style.display = "block";
});

function runVerityCommand() {
 const command = commandInput.value.trim().toUpperCase();

 if (command === "/SAY.HI") {
  commandResponse.textContent = "HI ITS ME ITS VERITY";
 } else {
  commandResponse.textContent = "UNKNOWN COMMAND";
 }
}

commandCheck.addEventListener("click", runVerityCommand);

commandInput.addEventListener("keydown", event => {
 if (event.key === "Enter") {
  event.preventDefault();
  runVerityCommand();
 }
});

// =====================
// QUESTS SYSTEM
// =====================

questsButton.addEventListener("click", () => {
 if (overlay.style.display === "none") {
  return;
 }

 closeAllSecretPanels();

 questsLoginPanel.style.display = "block";
 questUserInput.value = "";
 questsMessage.textContent = "";
 questUserInput.focus();
});

questsClose.addEventListener("click", () => {
 questsLoginPanel.style.display = "none";
});

questsResultClose.addEventListener("click", () => {
 questsResultPanel.style.display = "none";
});

function checkQuests() {
 const username = questUserInput.value.trim().toUpperCase();

 if (username === "ROWAN-Q83T0") {
  questsLoginPanel.style.display = "none";
  questsResultPanel.style.display = "block";
  questsMessage.textContent = "";
 } else {
  questsMessage.textContent = "INVALID QUEST USER";
 }
}

checkQuestsButton.addEventListener("click", checkQuests);

questUserInput.addEventListener("keydown", event => {
 if (event.key === "Enter") {
  event.preventDefault();
  checkQuests();
 }
});

// =====================
// ESCAPE KEY
// =====================

document.addEventListener("keydown", event => {
 if (event.key === "Escape" && updatingScreen.style.display === "flex") {
  updatingScreen.style.display = "none";
  overlay.style.display = "flex";
 }
});

// =====================
// INITIAL STATE
// =====================

updatingScreen.style.display = "none";
overlay.style.display = "flex";
</script>

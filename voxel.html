<style>

<body>
<div id="top"><div id="logo">VOXEL</div><div id="status">READY TO FLY</div></div>
<div id="moneyDisplay">00.00</div>
<div id="message"></div>

<div id="mobileControls">
<button id="mobileMenu">MENU</button>

<button class="moveBtn" id="moveForward">▲</button>

<button class="moveBtn" id="moveBack">▼</button>
<button class="moveBtn" id="moveRight">▶</button>
</div>
</div>

<div id="overlay">
<div id="panel">
<h1>VOXEL</h1>
<button id="play" class="menu-button">JOIN WORLD</button>

</div>

<div id="codeMachine">

<script type="module">
import * as THREE from "three";

// SCENE AND LIGHTING
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 100, 280);

const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.domElement.style.position = "fixed";
renderer.domElement.style.inset = "0";
renderer.domElement.style.zIndex = "0";
renderer.domElement.style.touchAction = "none";
document.body.prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x637b4d, 2));
const sun = new THREE.DirectionalLight(0xffffff, 2.3);
sun.position.set(30, 55, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
scene.add(sun);

// GRASS PLATFORM
const grassCanvas = document.createElement("canvas");
grassCanvas.width = 256;
grassCanvas.height = 256;
const grassCtx = grassCanvas.getContext("2d");
grassCtx.fillStyle = "#579b38";
grassCtx.fillRect(0, 0, 256, 256);

for (let i = 0; i < 6000; i++) {
  const x = Math.random() * 256;
  const y = Math.random() * 256;
  const size = 1 + Math.random() * 3;
  grassCtx.fillStyle = Math.random() > 0.5 ? "#6cab45" : "#397b2c";
  grassCtx.fillRect(x, y, size, size);
}

const grassTexture = new THREE.CanvasTexture(grassCanvas);
grassTexture.wrapS = THREE.RepeatWrapping;
grassTexture.wrapT = THREE.RepeatWrapping;
grassTexture.repeat.set(36, 14);

const grassTopMaterial = new THREE.MeshLambertMaterial({map:grassTexture});
const dirtSideMaterial = new THREE.MeshLambertMaterial({color:0x6c4930});
const groundMaterials = [
  dirtSideMaterial, dirtSideMaterial,
  grassTopMaterial, dirtSideMaterial,
  dirtSideMaterial, dirtSideMaterial
];

const MAP_WIDTH = 150;
const MAP_DEPTH = 45;

const ground = new THREE.Mesh(
  new THREE.BoxGeometry(MAP_WIDTH, 3, MAP_DEPTH),
  groundMaterials
);
ground.position.set(0, -1.5, 0);
ground.receiveShadow = true;
ground.castShadow = true;
scene.add(ground);

// RED CARPET AND END WALLS
const carpetLength = 150;
const carpetWidth = 5;

const carpetMaterial = new THREE.MeshStandardMaterial({
  color: 0xff0000,
  roughness: 1
});

const wallMaterial = new THREE.MeshStandardMaterial({
  color: 0x858585,
  roughness: 1
});

const carpet = new THREE.Mesh(
  new THREE.BoxGeometry(carpetLength, 0.14, carpetWidth),
  carpetMaterial
);
carpet.position.set(0, 0.07, 0);
carpet.receiveShadow = true;
scene.add(carpet);

const wallHeight = 4;
const wallThickness = 0.6;

for (const x of [
  -(carpetLength / 2 - wallThickness / 2),
  carpetLength / 2 - wallThickness / 2
]) {
  const wall = new THREE.Mesh(
    new THREE.BoxGeometry(wallThickness, wallHeight, carpetWidth),
    wallMaterial
  );
  wall.position.set(x, wallHeight / 2, 0);
  wall.castShadow = true;
  wall.receiveShadow = true;
  scene.add(wall);
}

// STONE AREA
const stoneGroundMaterial = new THREE.MeshStandardMaterial({
  color: 0x85898d,
  roughness: 1,
  flatShading: true
});

const stoneGround = new THREE.Mesh(
  new THREE.BoxGeometry(13, 0.7, 11),
  stoneGroundMaterial
);
stoneGround.position.set(-64, 0.35, -15);
stoneGround.receiveShadow = true;
stoneGround.castShadow = true;
scene.add(stoneGround);

// FOUR DARK GREY STONES
const darkStoneMaterial = new THREE.MeshStandardMaterial({
  color: 0x45494e,
  roughness: 1,
  flatShading: true
});

const darkStonePositions = [
  [-67, -17],
  [-61, -17],
  [-67, -12],
  [-61, -12]
];

for (const [x, z] of darkStonePositions) {
  const darkStone = new THREE.Mesh(
    new THREE.BoxGeometry(3, 0.25, 3),
    darkStoneMaterial
  );
  darkStone.position.set(x, 0.825, z);
  darkStone.castShadow = true;
  darkStone.receiveShadow = true;
  scene.add(darkStone);
}

// FOUR GREEN PLATES
const greenPlateMaterial = new THREE.MeshStandardMaterial({
  color: 0x25d43b,
  roughness: 0.8
});

const greenPlatePositions = [
  [-67, -13.5],
  [-61, -13.5],
  [-67, -8.5],
  [-61, -8.5]
];

for (const [x, z] of greenPlatePositions) {
  const greenPlate = new THREE.Mesh(
    new THREE.BoxGeometry(3, 0.18, 2),
    greenPlateMaterial
  );
  greenPlate.position.set(x, 0.79, z);
  greenPlate.castShadow = true;
  greenPlate.receiveShadow = true;
  scene.add(greenPlate);
}

  // STARTER PLATE MONEY SYSTEM

// TEXT SPRITES FOR THE PLATES AND STARTER CUBE
function makeTextSprite(text, options = {}) {
  const canvas = document.createElement("canvas");
  canvas.width = options.width || 512;
  canvas.height = options.height || 128;

  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (options.background) {
    ctx.fillStyle = options.background;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  ctx.font = `900 ${options.fontSize || 58}px Arial`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.lineJoin = "round";
  ctx.lineWidth = options.outlineWidth || 8;
  ctx.strokeStyle = options.outline || "#202020";
  ctx.strokeText(text, canvas.width / 2, canvas.height / 2);
  ctx.fillStyle = options.color || "#ffffff";
  ctx.fillText(text, canvas.width / 2, canvas.height / 2);

  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;

  const material = new THREE.SpriteMaterial({
    map: texture,
    transparent: true,
    depthTest: false
  });

  const sprite = new THREE.Sprite(material);
  sprite.renderOrder = 10;
  return sprite;
}

let yaw = 0;
let isLocked = false;
const keys = {};

function updateCameraRotation() {
  const distance = 7;
  const height = 2.5;

  camera.position.set(
    playerStone.position.x + Math.sin(yaw) * distance,
    playerStone.position.y + height,
    playerStone.position.z + Math.cos(yaw) * distance
  );

  camera.lookAt(
    playerStone.position.x,
    playerStone.position.y,
    playerStone.position.z
  );
}

function respawnPlayer() {
  playerStone.position.set(-64, 4, -5);
  yaw = 0;
  updateCameraRotation();
}

function updatePlayer(delta) {
  const speed = 12;
  const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
  const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
  const direction = new THREE.Vector3();

  if (keys.KeyW) direction.add(forward);
  if (keys.KeyS) direction.sub(forward);
  if (keys.KeyD) direction.add(right);
  if (keys.KeyA) direction.sub(right);

  if (direction.lengthSq() > 0) {
    direction.normalize().multiplyScalar(speed * delta);
    playerStone.position.add(direction);
  }

  playerStone.position.x = THREE.MathUtils.clamp(playerStone.position.x, -73, 73);
  playerStone.position.z = THREE.MathUtils.clamp(playerStone.position.z, -21, 21);
  playerStone.position.y = THREE.MathUtils.clamp(playerStone.position.y, 1, 80);

  updateCameraRotation();
}

document.addEventListener("pointerlockchange", () => {
  if (mobileDevice.matches) return;

  isLocked = document.pointerLockElement === renderer.domElement;
  overlay.style.display = isLocked ? "none" : "flex";
  mobileControls.style.display = "none";

  if (isLocked) {
    stopHalloweenEvent();
    closeAllSecretPanels();
    status.textContent = "FLYING WORLD";
  } else {
    status.textContent = "READY TO FLY";
  }

  for (const code in keys) keys[code] = false;
});

document.addEventListener("mousemove", event => {
  if (!isLocked || mobileDevice.matches) return;
  yaw -= event.movementX * 0.002;
});

document.addEventListener("keydown", event => {
  const active = document.activeElement;
  const typing = active && (active.tagName === "INPUT" || active.tagName === "TEXTAREA");
  if (typing) return;

  keys[event.code] = true;

  if (event.code === "Escape" && isLocked) {
    event.preventDefault();
    if (mobileDevice.matches) stopMobileGame();
    else document.exitPointerLock();
  }
});

document.addEventListener("keyup", event => {
  keys[event.code] = false;
});

// MOBILE ARROW MOVEMENT
function mobileButton(id, keyCode) {
  const btn = document.getElementById(id);

  btn.addEventListener("pointerdown", event => {
    event.preventDefault();
    event.stopPropagation();
    btn.setPointerCapture(event.pointerId);
    keys[keyCode] = true;
    btn.classList.add("active");
  });

  function release() {
    keys[keyCode] = false;
    btn.classList.remove("active");
  }

  btn.addEventListener("pointerup", release);
  btn.addEventListener("pointercancel", release);
  btn.addEventListener("lostpointercapture", release);
}

// MOBILE CAMERA: HORIZONTAL ROTATION ONLY
let mobileLooking = false;
let lookPointerId = null;
let lastTouchX = 0;
let lastTouchY = 0;

renderer.domElement.addEventListener("pointerdown", event => {
  if (!mobileDevice.matches || !isLocked || event.pointerType === "mouse") return;
  mobileLooking = true;
  lookPointerId = event.pointerId;
  lastTouchX = event.clientX;
  lastTouchY = event.clientY;
});

renderer.domElement.addEventListener("pointermove", event => {
  if (!mobileLooking || event.pointerId !== lookPointerId) return;
  const dx = event.clientX - lastTouchX;
  lastTouchX = event.clientX;
  lastTouchY = event.clientY;
  yaw -= dx * 0.006;
});

function stopMobileLooking() {
  mobileLooking = false;
  lookPointerId = null;
}
renderer.domElement.addEventListener("pointerup", stopMobileLooking);
renderer.domElement.addEventListener("pointercancel", stopMobileLooking);

// ANIMATION
let lastTime = performance.now();

  // STARTER PLATE REWARD SYSTEM
function updateStarterPlate(delta) {
  starterPlateTimer += delta;

  // Increase the plate value by 0.50 every 5 seconds
  while (starterPlateTimer >= 5) {
    starterPlateTimer -= 5;
    starterPlateMoney += 0.50;
  }

  // Update only the plate in front of STARTER THE DOO
  const starterLabel = plateMoneyLabels.find(
    label => label.x === -61 && label.z === -8.5
  );

  if (starterLabel) {
    starterLabel.sprite.material.map.dispose();

    const newTextureCanvas = document.createElement("canvas");
    newTextureCanvas.width = 512;
    newTextureCanvas.height = 128;

    const ctx = newTextureCanvas.getContext("2d");
    ctx.font = "900 64px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.lineJoin = "round";
    ctx.lineWidth = 10;
    ctx.strokeStyle = "#126d20";
    ctx.strokeText(formatMoney(starterPlateMoney), 256, 64);
    ctx.fillStyle = "#ffffff";
    ctx.fillText(formatMoney(starterPlateMoney), 256, 64);

    const texture = new THREE.CanvasTexture(newTextureCanvas);
    texture.colorSpace = THREE.SRGBColorSpace;
    starterLabel.sprite.material.map = texture;
    starterLabel.sprite.material.needsUpdate = true;
  }

  // Collect the money when the player reaches the starter plate
  const dx = playerStone.position.x - starterPlatePosition.x;
  const dz = playerStone.position.z - starterPlatePosition.z;
  const isOnPlate = Math.abs(dx) < 1.5 && Math.abs(dz) < 1;

  if (isLocked && isOnPlate && starterPlateMoney > 0) {
    money += starterPlateMoney;
    starterPlateMoney = 0;
    starterPlateTimer = 0;

    moneyDisplay.textContent = formatMoney(money);
    showMessage("+" + formatMoney(money) + " MONEY!");

    if (starterLabel) {
      const canvas = document.createElement("canvas");
      canvas.width = 512;
      canvas.height = 128;

      const ctx = canvas.getContext("2d");
      ctx.font = "900 64px Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.lineJoin = "round";
      ctx.lineWidth = 10;
      ctx.strokeStyle = "#126d20";
      ctx.strokeText("00.00", 256, 64);
      ctx.fillStyle = "#ffffff";
      ctx.fillText("00.00", 256, 64);

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      starterLabel.sprite.material.map = texture;
      starterLabel.sprite.material.needsUpdate = true;
    }
  }
}
  
function animate(now) {
  requestAnimationFrame(animate);

  const delta = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  // Starter cube keeps rotating even while the menu is open.
  starterCube.rotation.y += delta * 0.8;
  starterCube.rotation.x = Math.sin(now * 0.0008) * 0.08;
  updateStarterPlate(delta);
  
  if (isLocked) {
    playerStone.rotation.y += delta * 0.3;
    updatePlayer(delta);
  }

  renderer.render(scene, camera);
}

requestAnimationFrame(animate);

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  updateCameraRotation();
});

updateCameraRotation();

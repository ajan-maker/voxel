<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOXEL</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #87ceeb;
  color: white;
}

canvas { display: block; }

#crosshair {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 25px;
  font-weight: bold;
  pointer-events: none;
  text-shadow: 1px 1px 3px black;
}

#top {
  position: fixed;
  top: 15px;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  pointer-events: none;
  text-shadow: 2px 2px 4px black;
}

#logo {
  font-size: 32px;
  font-weight: 900;
  letter-spacing: 5px;
}

#status {
  margin-top: 7px;
  font-size: 12px;
  color: #e8ffe8;
}

#hotbar {
  position: fixed;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 6px;
}

.slot {
  width: 58px;
  height: 58px;
  border: 3px solid #777;
  background: #222b;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  font-size: 11px;
  cursor: pointer;
}

.slot.selected {
  border-color: white;
  background: #ffffff44;
  transform: translateY(-5px);
}

.swatch {
  width: 25px;
  height: 25px;
  margin-bottom: 4px;
  border: 2px solid #0005;
}

#help {
  position: fixed;
  left: 15px;
  bottom: 15px;
  font-size: 12px;
  line-height: 1.8;
  background: #0009;
  padding: 10px 14px;
  border-radius: 8px;
  pointer-events: none;
}

#buttons {
  position: fixed;
  top: 15px;
  right: 15px;
  display: flex;
  gap: 7px;
}

button {
  padding: 10px 13px;
  background: #222d;
  border: 1px solid #ffffff66;
  color: white;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
}

button:hover { background: #555e; }

#overlay {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  background-color: #777;
  background-image:
    linear-gradient(#0002 1px, transparent 1px),
    linear-gradient(90deg, #0002 1px, transparent 1px);
  background-size: 32px 32px;
}

#panel {
  width: min(700px, 95%);
  padding: 20px;
  text-align: center;
  background: transparent;
  border: none;
  box-shadow: none;
}

#panel h1 {
  display: block;
  color: black;
  font-size: clamp(55px, 9vw, 100px);
  font-weight: 900;
  letter-spacing: 10px;
  margin: 0 0 35px;
  text-shadow: 2px 2px 0 #aaa;
}

#panel p { display: none; }

#panel .menu-button {
  display: block;
  width: 100%;
  min-height: 115px;
  margin: 0 auto 34px;
  padding: 15px;
  color: black;
  background-color: #a66d48;
  background-image:
    linear-gradient(#ffffff0c 1px, transparent 1px),
    linear-gradient(90deg, #00000018 1px, transparent 1px);
  background-size: 16px 16px;
  border: 3px solid #805132;
  border-radius: 0;
  font-size: clamp(25px, 5vw, 48px);
  font-weight: 400;
  cursor: pointer;
}

#panel .menu-button:hover { background-color: #bd8259; }

#pickaxe-hud {
  position: fixed;
  right: 25px;
  bottom: 25px;
  width: 190px;
  height: 190px;
  pointer-events: none;
  z-index: 11;
}

#pickaxe-hud canvas {
  display: block;
  width: 100%;
  height: 100%;
}

#message {
  position: fixed;
  top: 100px;
  left: 50%;
  transform: translateX(-50%);
  padding: 8px 15px;
  background: #0009;
  border-radius: 6px;
  opacity: 0;
  transition: opacity .2s;
  pointer-events: none;
  z-index: 12;
}

@media(max-width:600px) {
  #help { font-size: 10px; }
  .slot { width: 45px; height: 51px; }
  #buttons { top: 8px; right: 8px; }
  #logo { font-size: 25px; }
  #pickaxe-hud {
    right: 5px;
    bottom: 5px;
    width: 125px;
    height: 125px;
  }
  #panel .menu-button {
    min-height: 80px;
    margin-bottom: 22px;
  }
  #panel h1 { margin-bottom: 25px; }
}
</style>

{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
  }

</head>

<body>

<div id="top">
  <div id="logo">voxel</div>

</div>

  <button id="saveBtn">SAVE WORLD</button>

  <div id="panel">
    <h1>VOXEL</h1>

<script type="module">
import * as THREE from "three";

import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {
  getAuth,
  signInAnonymously
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

import {
  getDatabase,
  ref,
  set,
  onValue,
  onDisconnect,
  remove
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js";

// =============================
// FIREBASE — HUB MULTIPLAYER ONLY
// =============================

const firebaseConfig = {
  apiKey: "AIzaSyC3SfEBKdlwZvTOTH-la0sK4A85h75W7s",
  authDomain: "voxel-cc64b.firebaseapp.com",
  databaseURL: "https://voxel-cc64b-default-rtdb.firebaseio.com",
  projectId: "voxel-cc64b",
  storageBucket: "voxel-cc64b.firebasestorage.app",
  messagingSenderId: "961192561088",
  appId: "1:961192561088:web:3258d76dd17f4d119c2025"
};

const firebaseApp = initializeApp(firebaseConfig);
const firebaseAuth = getAuth(firebaseApp);
const firebaseDatabase = getDatabase(firebaseApp);

let firebaseUid = null;

const firebaseReady = signInAnonymously(firebaseAuth)
  .then(result => {
    firebaseUid = result.user.uid;
    return firebaseUid;
  })
  .catch(error => {
    console.error("VOXEL HUB multiplayer sign-in failed:", error);
    return null;
  });

// =============================
// GAME SETUP
// =============================

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 25, 65);

const camera = new THREE.PerspectiveCamera(
  75, innerWidth / innerHeight, 0.1, 1000
);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x667755, 2));

const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.position.set(15, 30, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
scene.add(sun);

// =============================
// BLOCK SYSTEM
// =============================

const materials = {
  grass: new THREE.MeshLambertMaterial({ color: 0x55ad43 }),
  dirt: new THREE.MeshLambertMaterial({ color: 0x80502e }),
  stone: new THREE.MeshLambertMaterial({ color: 0x858585 })
};

const blockNames = ["grass", "dirt", "stone"];
const blockColors = ["#55ad43", "#80502e", "#858585"];
const geometry = new THREE.BoxGeometry(1, 1, 1);
const blocks = new Map();

const key = (x, y, z) => `${x},${y},${z}`;

function addBlock(x, y, z, type) {
  const k = key(x, y, z);
  if (blocks.has(k)) return;

  const mesh = new THREE.Mesh(
    geometry,
    materials[type] || materials.grass
  );

  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.userData = { x, y, z, type };

  scene.add(mesh);
  blocks.set(k, mesh);
}

function removeBlock(mesh) {
  const { x, y, z } = mesh.userData;
  scene.remove(mesh);
  blocks.delete(key(x, y, z));
  scheduleSave();
}

function clearWorld() {
  for (const mesh of blocks.values()) {
    scene.remove(mesh);
  }
  blocks.clear();
}

function generateWorld() {
  clearWorld();

  for (let x = -12; x < 12; x++) {
    for (let z = -12; z < 12; z++) {
      addBlock(x, 0, z, "grass");
      addBlock(x, -1, z, "dirt");
      addBlock(x, -2, z, "stone");
    }
  }

  const trees = [
    [-7, -6], [6, -8], [-8, 5], [8, 6], [3, 9]
  ];

  for (const [x, z] of trees) {
    for (let y = 1; y <= 3; y++) {
      addBlock(x, y, z, "dirt");
    }

    for (let dx = -1; dx <= 1; dx++) {
      for (let dz = -1; dz <= 1; dz++) {
        for (let y = 3; y <= 4; y++) {
          addBlock(x + dx, y, z + dz, "grass");
        }
      }
    }

    addBlock(x, 5, z, "grass");
  }
}

// =============================
// SAVE / LOAD
// =============================

const SAVE_KEY = "voxel-world-v1";
let saveTimer;
let messageTimeout;

let hubMode = false;
let normalWorldSnapshot = null;
let normalPlayerPosition = null;
let normalYaw = 0;
let normalPitch = 0;

function showMessage(text) {
  const el = document.getElementById("message");
  el.textContent = text;
  el.style.opacity = "1";

  clearTimeout(messageTimeout);
  messageTimeout = setTimeout(() => {
    el.style.opacity = "0";
  }, 1800);
}

function saveWorld() {
  if (hubMode) return false;

  try {
    const data = [...blocks.values()].map(mesh => {
      const { x, y, z, type } = mesh.userData;
      return [x, y, z, type];
    });

    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    document.getElementById("status").textContent = "WORLD SAVED ✓";
    return true;
  } catch (error) {
    document.getElementById("status").textContent = "SAVE FAILED";
    showMessage("Could not save world!");
    return false;
  }
}

function scheduleSave() {
  if (hubMode) return;

  document.getElementById("status").textContent = "UNSAVED CHANGES";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveWorld, 400);
}

function loadWorld() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);

    if (raw) {
      const data = JSON.parse(raw);

      if (Array.isArray(data) && data.length > 0 && data.length < 10000) {
        clearWorld();

        for (const item of data) {
          if (!Array.isArray(item) || item.length !== 4) continue;

          const [x, y, z, type] = item;

          if (
            !Number.isInteger(x) ||
            !Number.isInteger(y) ||
            !Number.isInteger(z) ||
            !blockNames.includes(type) ||
            Math.abs(x) > 100 ||
            Math.abs(y) > 100 ||
            Math.abs(z) > 100
          ) continue;

          addBlock(x, y, z, type);
        }

        if (blocks.size > 0) {
          document.getElementById("status").textContent = "WORLD LOADED ✓";
          return;
        }
      }
    }
  } catch (error) {
    console.warn("Could not load saved world.", error);
  }

  generateWorld();
  saveWorld();
}

loadWorld();

// =============================
// PLAYER
// =============================

camera.position.set(0, 2.6, 5);

let yaw = 0;
let pitch = 0;
let selectedBlock = "grass";
let isLocked = false;
let velocityY = 0;
let canJump = false;

const keys = {};
const playerRadius = 0.3;
const playerHeight = 1.8;

const raycaster = new THREE.Raycaster();
raycaster.far = 6;

function updateCameraRotation() {
  camera.rotation.order = "YXZ";
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;
}

// Collision detection for the player's body.
function collidesAt(px, py, pz) {
  const minX = Math.floor(px - playerRadius + 0.5);
  const maxX = Math.floor(px + playerRadius + 0.5);
  const minY = Math.floor(py - playerHeight + 0.5);
  const maxY = Math.floor(py + 0.1 + 0.5);
  const minZ = Math.floor(pz - playerRadius + 0.5);
  const maxZ = Math.floor(pz + playerRadius + 0.5);

  for (let x = minX; x <= maxX; x++) {
    for (let y = minY; y <= maxY; y++) {
      for (let z = minZ; z <= maxZ; z++) {
        if (blocks.has(key(x, y, z))) return true;
      }
    }
  }

  return false;
}

// Find the surface on which the player should land.
function findLandingHeight(px, currentY, nextY, pz) {
  const currentFeet = currentY - playerHeight;
  const nextFeet = nextY - playerHeight;
  let landingTop = -Infinity;

  for (const mesh of blocks.values()) {
    const { x, y, z } = mesh.userData;

    const overlapsX = Math.abs(px - x) < 0.5 + playerRadius;
    const overlapsZ = Math.abs(pz - z) < 0.5 + playerRadius;

    if (!overlapsX || !overlapsZ) continue;

    const top = y + 0.5;

    if (
      currentFeet >= top - 0.001 &&
      nextFeet <= top &&
      top > landingTop
    ) {
      landingTop = top;
    }
  }

  return landingTop;
}

function updatePlayer(delta) {
  const speed = 5.5;

  const forward = new THREE.Vector3(
    -Math.sin(yaw), 0, -Math.cos(yaw)
  );

  const right = new THREE.Vector3(
    Math.cos(yaw), 0, -Math.sin(yaw)
  );

  const direction = new THREE.Vector3();

  if (keys.KeyW) direction.add(forward);
  if (keys.KeyS) direction.sub(forward);
  if (keys.KeyD) direction.add(right);
  if (keys.KeyA) direction.sub(right);

  if (direction.lengthSq() > 0) {
    direction.normalize().multiplyScalar(speed * delta);

    const nextX = camera.position.x + direction.x;

    if (!collidesAt(nextX, camera.position.y, camera.position.z)) {
      camera.position.x = nextX;
    }

    const nextZ = camera.position.z + direction.z;

    if (!collidesAt(camera.position.x, camera.position.y, nextZ)) {
      camera.position.z = nextZ;
    }
  }

  velocityY -= 18 * delta;

  const currentY = camera.position.y;
  const nextY = currentY + velocityY * delta;

  if (velocityY <= 0) {
    const landingHeight = findLandingHeight(
      camera.position.x,
      currentY,
      nextY,
      camera.position.z
    );

    if (landingHeight !== -Infinity) {
      camera.position.y = landingHeight + playerHeight;
      velocityY = 0;
      canJump = true;
    } else if (collidesAt(
      camera.position.x,
      nextY,
      camera.position.z
    )) {
      velocityY = 0;
      canJump = false;
    } else {
      camera.position.y = nextY;
      canJump = false;
    }
  } else {
    if (collidesAt(
      camera.position.x,
      nextY,
      camera.position.z
    )) {
      velocityY = 0;
    } else {
      camera.position.y = nextY;
    }

    canJump = false;
  }

  if (camera.position.y < -20) {
    camera.position.set(0, 2.6, 5);
    velocityY = 0;
    canJump = false;
  }
}

// =============================
// HOTBAR
// =============================

const hotbar = document.getElementById("hotbar");

blockNames.forEach((type, i) => {
  const slot = document.createElement("div");

  slot.className = "slot" + (i === 0 ? " selected" : "");

  slot.innerHTML =
    `<div class="swatch" style="background:${blockColors[i]}"></div>` +
    `${i + 1}: ${type.toUpperCase()}`;

  slot.addEventListener("click", () => selectBlock(type));
  hotbar.appendChild(slot);
});

function selectBlock(type) {
  selectedBlock = type;

  [...hotbar.children].forEach((slot, i) => {
    slot.classList.toggle("selected", blockNames[i] === type);
  });
}

// =============================
// MENU
// =============================

const overlay = document.getElementById("overlay");
const pickaxeHud = document.createElement("div");

pickaxeHud.id = "pickaxe-hud";
document.body.appendChild(pickaxeHud);

// =============================
// HUB MULTIPLAYER ONLY
// =============================

let hubMultiplayerActive = false;
let hubPlayersUnsubscribe = null;
let myHubPlayerRef = null;
let hubLastSentAt = 0;
let hubWritePending = false;

const remoteHubPlayers = new Map();
const remoteStoneGeometry = new THREE.BoxGeometry(1, 1, 1);
const remoteStoneMaterial = new THREE.MeshLambertMaterial({
  color: 0x858585
});

async function startHubMultiplayer() {
  hubMultiplayerActive = true;

  const uid = await firebaseReady;

  if (!uid || !hubMultiplayerActive || !hubMode) {
    if (!uid && hubMultiplayerActive && hubMode) {
      showMessage("HUB multiplayer could not connect. Check Firebase Auth.");
    }
    return;
  }

  myHubPlayerRef = ref(firebaseDatabase, `hubPlayers/${uid}`);

  try {
    await onDisconnect(myHubPlayerRef).remove();

    if (!hubMultiplayerActive || !hubMode) {
      await remove(myHubPlayerRef);
      return;
    }

    hubPlayersUnsubscribe = onValue(
      ref(firebaseDatabase, "hubPlayers"),
      snapshot => {
        if (!hubMultiplayerActive || !hubMode) return;

        const players = snapshot.val() || {};
        const presentIds = new Set();

        for (const [playerId, data] of Object.entries(players)) {
          // Never show this browser's own block.
          if (playerId === firebaseUid || !data) continue;

          if (![data.x, data.y, data.z].every(
            value => Number.isFinite(value)
          )) continue;

          presentIds.add(playerId);

          let mesh = remoteHubPlayers.get(playerId);

          if (!mesh) {
            mesh = new THREE.Mesh(
              remoteStoneGeometry,
              remoteStoneMaterial
            );

            mesh.castShadow = true;
            mesh.receiveShadow = true;

            scene.add(mesh);
            remoteHubPlayers.set(playerId, mesh);
          }

          // The camera is at eye height, so lower the cube to the player's body.
          mesh.position.set(data.x, data.y - 1.3, data.z);
          mesh.rotation.y = Number.isFinite(data.yaw) ? data.yaw : 0;
        }

        // Remove blocks belonging to players who left the HUB.
        for (const [playerId, mesh] of remoteHubPlayers) {
          if (!presentIds.has(playerId)) {
            scene.remove(mesh);
            remoteHubPlayers.delete(playerId);
          }
        }
      },
      error => {
        console.error("VOXEL HUB player-list error:", error);

        if (hubMultiplayerActive && hubMode) {
          showMessage("HUB multiplayer connection error. Check database rules.");
        }
      }
    );
  } catch (error) {
    console.error("VOXEL HUB multiplayer setup failed:", error);

    if (hubMultiplayerActive && hubMode) {
      showMessage("HUB multiplayer setup failed. Check Firebase settings.");
    }
  }
}

function syncHubPlayer(now) {
  // Position syncing only runs while the player is in the HUB.
  if (
    !hubMultiplayerActive ||
    !hubMode ||
    !firebaseUid ||
    !myHubPlayerRef
  ) return;

  // Send position up to 10 times per second.
  if (now - hubLastSentAt < 100 || hubWritePending) return;

  hubLastSentAt = now;
  hubWritePending = true;

  set(myHubPlayerRef, {
    x: camera.position.x,
    y: camera.position.y,
    z: camera.position.z,
    yaw,
    updatedAt: Date.now()
  })
    .catch(error => {
      console.error("VOXEL HUB position sync failed:", error);
    })
    .finally(() => {
      hubWritePending = false;
    });
}

function stopHubMultiplayer() {
  hubMultiplayerActive = false;

  if (hubPlayersUnsubscribe) {
    hubPlayersUnsubscribe();
    hubPlayersUnsubscribe = null;
  }

  // Remove other players' cubes from this screen.
  for (const mesh of remoteHubPlayers.values()) {
    scene.remove(mesh);
  }

  remoteHubPlayers.clear();

  // Remove our presence from the HUB database.
  if (myHubPlayerRef) {
    const playerRef = myHubPlayerRef;
    myHubPlayerRef = null;

    remove(playerRef).catch(error => {
      console.warn("Could not remove HUB player presence:", error);
    });
  }

  hubLastSentAt = 0;
  hubWritePending = false;
}

// =============================
// TEMPORARY HUB WORLD
// =============================

function enterHub() {
  if (hubMode) return;

  // Keep the normal world in memory.
  normalWorldSnapshot = [...blocks.values()].map(mesh => {
    const { x, y, z, type } = mesh.userData;
    return [x, y, z, type];
  });

  normalPlayerPosition = camera.position.clone();
  normalYaw = yaw;
  normalPitch = pitch;

  hubMode = true;
  clearWorld();

  // 25 x 25 stone floor.
  for (let x = -12; x <= 12; x++) {
    for (let z = -12; z <= 12; z++) {
      addBlock(x, 0, z, "stone");
    }
  }

  // Stone walls: four layers above the floor.
  for (let y = 1; y <= 4; y++) {
    for (let i = -12; i <= 12; i++) {
      addBlock(i, y, -12, "stone");
      addBlock(i, y, 12, "stone");
      addBlock(-12, y, i, "stone");
      addBlock(12, y, i, "stone");
    }
  }

  camera.position.set(0, 2.6, 0);
  yaw = 0;
  pitch = 0;
  velocityY = 0;
  canJump = false;

  updateCameraRotation();

  document.getElementById("status").textContent =
    "HUB WORLD — NOT SAVED";

  // Multiplayer is activated ONLY in the HUB.
  startHubMultiplayer();

  renderer.domElement.requestPointerLock();
}

function leaveHub() {
  if (!hubMode) return;

  stopHubMultiplayer();
  clearWorld();

  // Restore the original world from memory.
  if (normalWorldSnapshot) {
    for (const [x, y, z, type] of normalWorldSnapshot) {
      addBlock(x, y, z, type);
    }
  }

  if (normalPlayerPosition) {
    camera.position.copy(normalPlayerPosition);
  }

  yaw = normalYaw;
  pitch = normalPitch;
  velocityY = 0;
  canJump = false;

  updateCameraRotation();

  hubMode = false;
  normalWorldSnapshot = null;
  normalPlayerPosition = null;

  document.getElementById("status").textContent = "WORLD RESTORED";
}

document.getElementById("play").addEventListener("click", () => {
  if (hubMode) leaveHub();
  renderer.domElement.requestPointerLock();
});

document.getElementById("joinHub").addEventListener("click", enterHub);

document.addEventListener("pointerlockchange", () => {
  isLocked = document.pointerLockElement === renderer.domElement;

  overlay.style.display = isLocked ? "none" : "flex";
  pickaxeHud.style.display = isLocked ? "none" : "block";

  // ESC in the HUB returns to the normal world.
  if (!isLocked && hubMode) {
    leaveHub();
  }
});

document.addEventListener("mousemove", event => {
  if (!isLocked) return;

  yaw -= event.movementX * 0.002;
  pitch -= event.movementY * 0.002;

  pitch = Math.max(
    -Math.PI / 2 + 0.01,
    Math.min(Math.PI / 2 - 0.01, pitch)
  );

  updateCameraRotation();
});

document.addEventListener("keydown", event => {
  keys[event.code] = true;

  if (["Space", "ArrowUp", "ArrowDown"].includes(event.code)) {
    event.preventDefault();
  }

  if (event.code === "Space" && canJump && isLocked) {
    velocityY = 7;
    canJump = false;
  }

  if (event.code === "Digit1") selectBlock("grass");
  if (event.code === "Digit2") selectBlock("dirt");
  if (event.code === "Digit3") selectBlock("stone");
});

document.addEventListener("keyup", event => {
  keys[event.code] = false;
});

document.addEventListener("contextmenu", event => {
  event.preventDefault();
});

// =============================
// BLOCK BREAKING / PLACING
// =============================

function getTargetBlock() {
  raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

  const hits = raycaster.intersectObjects([...blocks.values()], false);
  return hits.length ? hits[0] : null;
}

document.addEventListener("mousedown", event => {
  if (!isLocked || hubMode) return;

  const hit = getTargetBlock();
  if (!hit) return;

  if (event.button === 0) {
    removeBlock(hit.object);
  }

  if (event.button === 2) {
    const normal = hit.face.normal.clone();
    normal.transformDirection(hit.object.matrixWorld);

    const pos = hit.object.position.clone().add(normal);

    const px = camera.position.x;
    const pz = camera.position.z;

    const overlapsPlayer =
      Math.abs(pos.x - px) < 0.5 + playerRadius &&
      Math.abs(pos.z - pz) < 0.5 + playerRadius &&
      Math.abs(pos.y - camera.position.y) < 1.45;

    if (overlapsPlayer) return;

    addBlock(
      Math.round(pos.x),
      Math.round(pos.y),
      Math.round(pos.z),
      hubMode ? "stone" : selectedBlock
    );

    scheduleSave();
  }
});

// =============================
// 3D STONE PICKAXE
// MENU ONLY
// =============================

const pickScene = new THREE.Scene();

const pickCamera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
pickCamera.position.set(0, 0, 7);

const pickRenderer = new THREE.WebGLRenderer({
  alpha: true,
  antialias: true
});

pickRenderer.setPixelRatio(Math.min(devicePixelRatio, 2));
pickRenderer.setSize(190, 190);
pickRenderer.setClearColor(0x000000, 0);
pickaxeHud.appendChild(pickRenderer.domElement);

pickScene.add(new THREE.HemisphereLight(0xffffff, 0x49413a, 2));

const pickLight = new THREE.DirectionalLight(0xffffff, 3);
pickLight.position.set(3, 5, 6);
pickScene.add(pickLight);

const pickaxe = new THREE.Group();
pickScene.add(pickaxe);

const handle = new THREE.Mesh(
  new THREE.CylinderGeometry(0.09, 0.13, 1.9, 7),
  new THREE.MeshStandardMaterial({
    color: 0x986039,
    roughness: 0.85
  })
);

handle.rotation.z = -0.55;
handle.position.set(-0.2, -0.15, 0);
pickaxe.add(handle);

const stoneMaterial = new THREE.MeshStandardMaterial({
  color: 0x555b61,
  roughness: 1,
  flatShading: true
});

const stoneHead = new THREE.Mesh(
  new THREE.IcosahedronGeometry(0.52, 0),
  stoneMaterial
);

stoneHead.scale.set(1.65, 0.65, 0.7);
stoneHead.rotation.z = -0.35;
stoneHead.position.set(0.45, 0.72, 0);
pickaxe.add(stoneHead);

const stoneTip = new THREE.Mesh(
  new THREE.ConeGeometry(0.28, 0.65, 5),
  stoneMaterial
);

stoneTip.rotation.z = -1.15;
stoneTip.position.set(1.05, 0.88, 0);
pickaxe.add(stoneTip);

const binding = new THREE.Mesh(
  new THREE.CylinderGeometry(0.15, 0.15, 0.22, 8),
  new THREE.MeshStandardMaterial({ color: 0xb47743 })
);

binding.position.set(-0.05, 0.15, 0);
binding.rotation.z = -0.55;
pickaxe.add(binding);

pickaxe.rotation.z = -0.25;
pickaxe.scale.setScalar(0.85);

let pickaxeTime = 0;

function animatePickaxe() {
  requestAnimationFrame(animatePickaxe);

  pickaxeTime += 0.018;
  pickaxe.rotation.y += 0.018;
  pickaxe.rotation.x = Math.sin(pickaxeTime) * 0.12;
  pickaxe.position.y = Math.sin(pickaxeTime * 1.5) * 0.08;

  pickRenderer.render(pickScene, pickCamera);
}

animatePickaxe();

// =============================
// SAVE / RESET BUTTONS
// =============================

document.getElementById("saveBtn").addEventListener("click", () => {
  if (hubMode) {
    showMessage("Hub world cannot be saved!");
    return;
  }

  if (saveWorld()) {
    showMessage("World saved successfully!");
  }
});

document.getElementById("resetBtn").addEventListener("click", () => {
  if (hubMode) {
    showMessage("Leave the hub before creating a new world.");
    return;
  }

  if (!confirm("Are you sure you want to create a new world?")) return;

  localStorage.removeItem(SAVE_KEY);
  generateWorld();

  camera.position.set(0, 2.6, 5);
  velocityY = 0;
  canJump = false;

  saveWorld();
  showMessage("New world created!");
});

// =============================
// GAME LOOP
// =============================

let lastTime = performance.now();

function animate(now) {
  requestAnimationFrame(animate);

  const delta = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  if (isLocked) updatePlayer(delta);

  // Position syncing runs ONLY inside the HUB.
  if (hubMode && isLocked) {
    syncHubPlayer(now);
  }

  renderer.render(scene, camera);
}

requestAnimationFrame(animate);

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);

  pickCamera.aspect = 1;
  pickCamera.updateProjectionMatrix();

  pickRenderer.setSize(
    pickaxeHud.clientWidth,
    pickaxeHud.clientHeight
  );
});

addEventListener("beforeunload", () => {
  clearTimeout(saveTimer);

  // Remove this player from the HUB.
  // Firebase onDisconnect is registered as a backup.
  stopHubMultiplayer();

  // Never save the temporary hub.
  if (!hubMode) saveWorld();
});
</script>

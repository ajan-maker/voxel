<script type="module">
import * as THREE from "three";

// =====================
// GAME SETUP
// =====================

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb,25,65);

const camera = new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,1000);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.domElement.style.position="fixed";
renderer.domElement.style.inset="0";
renderer.domElement.style.zIndex="0";
renderer.domElement.style.touchAction="none";
document.body.prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x667755,2));

const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(15,30,10);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
scene.add(sun);

// =====================
// BLOCK SYSTEM
// =====================

const materials={
 grass:new THREE.MeshLambertMaterial({color:0x55ad43}),
 dirt:new THREE.MeshLambertMaterial({color:0x80502e}),
 stone:new THREE.MeshLambertMaterial({color:0x858585})
};

const blockNames=["grass","dirt","stone"];
const blockColors=["#55ad43","#80502e","#858585"];
const geometry=new THREE.BoxGeometry(1,1,1);
const blocks=new Map();
const key=(x,y,z)=>`${x},${y},${z}`;

let hubMode=false;
let normalWorldSnapshot=null;
let normalPlayerPosition=null;
let normalYaw=0,normalPitch=0;

function addBlock(x,y,z,type){
 const k=key(x,y,z);
 if(blocks.has(k))return;
 const mesh=new THREE.Mesh(geometry,materials[type]||materials.grass);
 mesh.position.set(x,y,z);
 mesh.castShadow=true;
 mesh.receiveShadow=true;
 mesh.userData={x,y,z,type};
 scene.add(mesh);
 blocks.set(k,mesh);
}

function removeBlock(mesh){
 if(hubMode||mobileDevice.matches)return;
 const {x,y,z}=mesh.userData;
 scene.remove(mesh);
 blocks.delete(key(x,y,z));
 scheduleSave();
}

function clearWorld(){
 for(const mesh of blocks.values())scene.remove(mesh);
 blocks.clear();
}

function generateWorld(){
 clearWorld();

 for(let x=-12;x<12;x++){
  for(let z=-12;z<12;z++){
   addBlock(x,0,z,"grass");
   addBlock(x,-1,z,"dirt");
   addBlock(x,-2,z,"stone");
  }
 }

 const trees=[[-7,-6],[6,-8],[-8,5],[8,6],[3,9]];

 for(const [x,z] of trees){
  for(let y=1;y<=3;y++)addBlock(x,y,z,"dirt");

  for(let dx=-1;dx<=1;dx++){
   for(let dz=-1;dz<=1;dz++){
    for(let y=3;y<=4;y++)addBlock(x+dx,y,z+dz,"grass");
   }
  }

  addBlock(x,5,z,"grass");
 }
}

// =====================
// SAVE / LOAD
// =====================

const SAVE_KEY="voxel-world-v1";
let saveTimer,messageTimeout;

function showMessage(text){
 const el=document.getElementById("message");
 el.textContent=text;
 el.style.opacity="1";
 clearTimeout(messageTimeout);
 messageTimeout=setTimeout(()=>el.style.opacity="0",1800);
}

function saveWorld(){
 if(hubMode)return false;

 try{
  const data=[...blocks.values()].map(m=>{
   const {x,y,z,type}=m.userData;
   return [x,y,z,type];
  });

  localStorage.setItem(SAVE_KEY,JSON.stringify(data));
  document.getElementById("status").textContent="WORLD SAVED ✓";
  return true;
 }catch(e){
  document.getElementById("status").textContent="SAVE FAILED";
  showMessage("Could not save world!");
  return false;
 }
}

function scheduleSave(){
 if(hubMode)return;

 document.getElementById("status").textContent="UNSAVED CHANGES";
 clearTimeout(saveTimer);
 saveTimer=setTimeout(saveWorld,400);
}

function loadWorld(){
 try{
  const raw=localStorage.getItem(SAVE_KEY);

  if(raw){
   const data=JSON.parse(raw);

   if(Array.isArray(data)&&data.length>0&&data.length<10000){
    clearWorld();

    for(const item of data){
     if(!Array.isArray(item)||item.length!==4)continue;

     const [x,y,z,type]=item;

     if(!Number.isInteger(x)||!Number.isInteger(y)||!Number.isInteger(z)||
       !blockNames.includes(type)||Math.abs(x)>100||Math.abs(y)>100||Math.abs(z)>100)continue;

     addBlock(x,y,z,type);
    }

    if(blocks.size>0){
     document.getElementById("status").textContent="WORLD LOADED ✓";
     return;
    }
   }
  }
 }catch(e){
  console.warn("Could not load saved world.",e);
 }

 generateWorld();
 saveWorld();
}

loadWorld();

// =====================
// PLAYER / COLLISIONS
// =====================

camera.position.set(0,2.6,5);

let yaw=0,pitch=0;
let selectedBlock="grass";
let isLocked=false;
let velocityY=0,canJump=false;

const keys={};
const playerRadius=.3;
const playerHeight=1.8;
const raycaster=new THREE.Raycaster();
raycaster.far=6;

const mobileDevice=window.matchMedia("(pointer: coarse), (max-width: 800px)");
const mobileControls=document.getElementById("mobileControls");
const mobileReset=document.getElementById("mobileReset");

function updateCameraRotation(){
 camera.rotation.order="YXZ";
 camera.rotation.y=yaw;
 camera.rotation.x=pitch;
}

function collidesAt(px,py,pz){
 const minX=px-playerRadius,maxX=px+playerRadius;
 const minY=py-playerHeight,maxY=py;
 const minZ=pz-playerRadius,maxZ=pz+playerRadius;

 for(let x=Math.floor(minX-.5);x<=Math.ceil(maxX+.5);x++){
  for(let y=Math.floor(minY-.5);y<=Math.ceil(maxY+.5);y++){
   for(let z=Math.floor(minZ-.5);z<=Math.ceil(maxZ+.5);z++){
    if(!blocks.has(key(x,y,z)))continue;

    if(maxX>x-.499&&minX<x+.499&&
       maxY>y-.499&&minY<y+.499&&
       maxZ>z-.499&&minZ<z+.499)return true;
   }
  }
 }

 return false;
}

function findLandingHeight(px,currentY,nextY,pz){
 const currentFeet=currentY-playerHeight;
 const nextFeet=nextY-playerHeight;

 if(nextFeet>=currentFeet)return null;

 let landingTop=-Infinity;

 for(let x=Math.floor(px-playerRadius-.5);x<=Math.ceil(px+playerRadius+.5);x++){
  for(let z=Math.floor(pz-playerRadius-.5);z<=Math.ceil(pz+playerRadius+.5);z++){
   for(let y=Math.floor(nextFeet-.5);y<=Math.ceil(currentFeet+.5);y++){
    if(!blocks.has(key(x,y,z)))continue;

    const overlapsX=px+playerRadius>x-.499&&px-playerRadius<x+.499;
    const overlapsZ=pz+playerRadius>z-.499&&pz-playerRadius<z+.499;
    const top=y+.5;

    if(overlapsX&&overlapsZ&&currentFeet>=top-.01&&nextFeet<=top&&top>landingTop){
     landingTop=top;
    }
   }
  }
 }

 return landingTop===-Infinity?null:landingTop;
}

function updatePlayer(delta){
 const speed=5.5;

 const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
 const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
 const direction=new THREE.Vector3();

 if(keys.KeyW)direction.add(forward);
 if(keys.KeyS)direction.sub(forward);
 if(keys.KeyD)direction.add(right);
 if(keys.KeyA)direction.sub(right);

 if(direction.lengthSq()>0){
  direction.normalize().multiplyScalar(speed*delta);

  const nextX=camera.position.x+direction.x;

  if(!collidesAt(nextX,camera.position.y,camera.position.z)){
   camera.position.x=nextX;
  }

  const nextZ=camera.position.z+direction.z;

  if(!collidesAt(camera.position.x,camera.position.y,nextZ)){
   camera.position.z=nextZ;
  }
 }

 const oldY=camera.position.y;
 velocityY=Math.max(velocityY-20*delta,-35);
 const nextY=oldY+velocityY*delta;

 if(velocityY<=0){
  const top=findLandingHeight(camera.position.x,oldY,nextY,camera.position.z);

  if(top!==null){
   camera.position.y=top+playerHeight;
   velocityY=0;
   canJump=true;
  }else{
   camera.position.y=nextY;
   canJump=false;
  }
 }else{
  if(collidesAt(camera.position.x,nextY,camera.position.z)){
   velocityY=0;
  }else{
   camera.position.y=nextY;
  }

  canJump=false;
 }

 if(camera.position.y < -20){
  camera.position.set(0,2.6,5);
  velocityY=0;
  canJump=false;
 }
}

// =====================
// HOTBAR
// =====================

const hotbar=document.getElementById("hotbar");

blockNames.forEach((type,i)=>{
 const slot=document.createElement("div");

 slot.className="slot"+(i===0?" selected":"");
 slot.innerHTML=`<div class="swatch" style="background:${blockColors[i]}"></div>${i+1}: ${type.toUpperCase()}`;
 slot.addEventListener("click",()=>selectBlock(type));

 hotbar.appendChild(slot);
});

function selectBlock(type){
 selectedBlock=type;

 [...hotbar.children].forEach((slot,i)=>{
  slot.classList.toggle("selected",blockNames[i]===type);
 });
}

// =====================
// MENU / PICKAXE
// =====================

const overlay=document.getElementById("overlay");
const pickaxeHud=document.createElement("div");

pickaxeHud.id="pickaxe-hud";
document.body.appendChild(pickaxeHud);

// =====================
// HUB WORLD
// =====================

function enterHub(){
 if(hubMode)return;

 normalWorldSnapshot=[...blocks.values()].map(m=>{
  const {x,y,z,type}=m.userData;
  return [x,y,z,type];
 });

 normalPlayerPosition=camera.position.clone();
 normalYaw=yaw;
 normalPitch=pitch;

 hubMode=true;
 mobileReset.style.display="none";

 clearWorld();

 for(let x=-12;x<=12;x++){
  for(let z=-12;z<=12;z++){
   addBlock(x,0,z,"stone");
  }
 }

 for(let y=1;y<=4;y++){
  for(let i=-12;i<=12;i++){
   addBlock(i,y,-12,"stone");
   addBlock(i,y,12,"stone");
   addBlock(-12,y,i,"stone");
   addBlock(12,y,i,"stone");
  }
 }

 camera.position.set(0,2.6,0);
 yaw=0;
 pitch=0;
 velocityY=0;
 canJump=false;

 for(const code in keys)keys[code]=false;

 updateCameraRotation();

 document.getElementById("status").textContent="HUB WORLD — NOT SAVED";

 if(!mobileDevice.matches)renderer.domElement.requestPointerLock();
}

function leaveHub(){
 if(!hubMode)return;

 clearWorld();

 if(normalWorldSnapshot){
  for(const [x,y,z,type] of normalWorldSnapshot){
   addBlock(x,y,z,type);
  }
 }

 if(normalPlayerPosition){
  camera.position.copy(normalPlayerPosition);
 }else{
  camera.position.set(0,2.6,5);
 }

 yaw=normalYaw;
 pitch=normalPitch;
 velocityY=0;
 canJump=false;

 for(const code in keys)keys[code]=false;

 hubMode=false;
 mobileReset.style.display="block";

 normalWorldSnapshot=null;
 normalPlayerPosition=null;

 updateCameraRotation();

 document.getElementById("status").textContent="WORLD RESTORED";
}

// =====================
// START / STOP GAME
// =====================

function startMobileGame(){
 isLocked=true;
 overlay.style.display="none";
 pickaxeHud.style.display="none";

 mobileControls.style.display=mobileDevice.matches?"block":"none";
 mobileReset.style.display=hubMode?"none":"block";

 updateCameraRotation();
}

document.getElementById("play").addEventListener("click",()=>{
 if(hubMode)leaveHub();

 if(mobileDevice.matches){
  startMobileGame();
 }else{
  renderer.domElement.requestPointerLock();
 }
});

document.getElementById("joinHub").addEventListener("click",()=>{
 enterHub();

 if(mobileDevice.matches){
  startMobileGame();
 }
});

document.addEventListener("pointerlockchange",()=>{
 if(mobileDevice.matches)return;

 isLocked=document.pointerLockElement===renderer.domElement;
 overlay.style.display=isLocked?"none":"flex";
 pickaxeHud.style.display=isLocked?"none":"block";
 mobileControls.style.display="none";

 for(const code in keys)keys[code]=false;

 if(!isLocked&&hubMode)leaveHub();
});

document.addEventListener("mousemove",event=>{
 if(!isLocked||mobileDevice.matches)return;

 yaw-=event.movementX*.002;
 pitch-=event.movementY*.002;
 pitch=Math.max(-Math.PI/2+.01,Math.min(Math.PI/2-.01,pitch));

 updateCameraRotation();
});

// =====================
// KEYBOARD
// =====================

document.addEventListener("keydown",event=>{
 keys[event.code]=true;

 if(event.code==="Space"){
  event.preventDefault();

  if(canJump&&isLocked){
   velocityY=7;
   canJump=false;
  }
 }

 if(event.code==="Digit1")selectBlock("grass");
 if(event.code==="Digit2")selectBlock("dirt");
 if(event.code==="Digit3")selectBlock("stone");

 if(event.code==="Escape"&&mobileDevice.matches&&isLocked){
  event.preventDefault();
  stopMobileGame();
 }
});

document.addEventListener("keyup",event=>{
 keys[event.code]=false;
});

document.addEventListener("contextmenu",event=>event.preventDefault());

// =====================
// MOBILE MOVEMENT BUTTONS
// =====================

function mobileButton(id,keyCode){
 const btn=document.getElementById(id);

 btn.addEventListener("pointerdown",event=>{
  event.preventDefault();
  event.stopPropagation();

  btn.setPointerCapture(event.pointerId);
  keys[keyCode]=true;
  btn.classList.add("active");
 });

 function release(event){
  keys[keyCode]=false;
  btn.classList.remove("active");
 }

 btn.addEventListener("pointerup",release);
 btn.addEventListener("pointercancel",release);
 btn.addEventListener("lostpointercapture",release);
}

mobileButton("moveForward","KeyW");
mobileButton("moveBack","KeyS");
mobileButton("moveLeft","KeyA");
mobileButton("moveRight","KeyD");

function stopMobileGame(){
 isLocked=false;
 mobileLooking=false;
 lookPointerId=null;

 for(const code in keys)keys[code]=false;

 if(hubMode)leaveHub();

 overlay.style.display="flex";
 pickaxeHud.style.display="block";
 mobileControls.style.display="none";
}

// =====================
// MOBILE MENU + RESET
// =====================

document.getElementById("mobileMenu").addEventListener("click",()=>{
 if(!mobileDevice.matches)return;

 if(isLocked){
  stopMobileGame();
 }else{
  overlay.style.display="flex";
 }
});

document.getElementById("mobileReset").addEventListener("click",()=>{
 if(!mobileDevice.matches||!isLocked||hubMode)return;

 clearTimeout(saveTimer);

 localStorage.removeItem(SAVE_KEY);
 generateWorld();

 camera.position.set(0,2.6,5);
 yaw=0;
 pitch=0;
 velocityY=0;
 canJump=false;

 for(const code in keys)keys[code]=false;

 selectBlock("grass");
 updateCameraRotation();

 saveWorld();
 showMessage("World reset!");
});

document.getElementById("mobileJump").addEventListener("pointerdown",event=>{
 event.preventDefault();

 if(isLocked&&canJump){
  velocityY=7;
  canJump=false;
 }
});

// =====================
// MOBILE LOOK + TAP TO PLACE
// =====================

let mobileLooking=false;
let lookPointerId=null;
let lastTouchX=0,lastTouchY=0;
let touchStartX=0,touchStartY=0;
let touchMoved=false;

renderer.domElement.addEventListener("pointerdown",event=>{
 if(!mobileDevice.matches||!isLocked||event.pointerType==="mouse")return;

 mobileLooking=true;
 lookPointerId=event.pointerId;

 lastTouchX=touchStartX=event.clientX;
 lastTouchY=touchStartY=event.clientY;

 touchMoved=false;
});

renderer.domElement.addEventListener("pointermove",event=>{
 if(!mobileDevice.matches||!mobileLooking||event.pointerId!==lookPointerId)return;

 const dx=event.clientX-lastTouchX;
 const dy=event.clientY-lastTouchY;

 if(Math.abs(event.clientX-touchStartX)>7||Math.abs(event.clientY-touchStartY)>7){
  touchMoved=true;
 }

 lastTouchX=event.clientX;
 lastTouchY=event.clientY;

 yaw-=dx*.006;
 pitch-=dy*.006;
 pitch=Math.max(-Math.PI/2+.01,Math.min(Math.PI/2-.01,pitch));

 updateCameraRotation();
});

renderer.domElement.addEventListener("pointerup",event=>{
 if(!mobileDevice.matches||event.pointerId!==lookPointerId)return;

 if(!touchMoved&&isLocked&&!hubMode){
  placeBlockAtCrosshair();
 }

 mobileLooking=false;
 lookPointerId=null;
});

renderer.domElement.addEventListener("pointercancel",()=>{
 mobileLooking=false;
 lookPointerId=null;
});

document.getElementById("mobilePlace").addEventListener("pointerdown",event=>{
 event.preventDefault();

 if(isLocked&&!hubMode){
  placeBlockAtCrosshair();
 }
});

// =====================
// BLOCK BREAKING / PLACING
// =====================

function getTargetBlock(){
 raycaster.setFromCamera(new THREE.Vector2(0,0),camera);

 const hits=raycaster.intersectObjects([...blocks.values()],false);

 return hits.length?hits[0]:null;
}

function placeBlockAtCrosshair(){
 if(!isLocked||hubMode)return;

 const hit=getTargetBlock();
 if(!hit)return;

 const normal=hit.face.normal.clone();
 normal.transformDirection(hit.object.matrixWorld);

 const pos=hit.object.position.clone().add(normal);

 const x=Math.round(pos.x);
 const y=Math.round(pos.y);
 const z=Math.round(pos.z);

 if(blocks.has(key(x,y,z)))return;

 const overlapsPlayer=
  Math.abs(x-camera.position.x)<.5+playerRadius&&
  Math.abs(z-camera.position.z)<.5+playerRadius&&
  y+.5>camera.position.y-playerHeight&&
  y-.5<camera.position.y;

 if(overlapsPlayer)return;

 addBlock(x,y,z,selectedBlock);
 scheduleSave();
}

document.addEventListener("mousedown",event=>{
 if(!isLocked||hubMode)return;
 if(mobileDevice.matches)return;
 if(event.button!==0&&event.button!==2)return;

 const hit=getTargetBlock();
 if(!hit)return;

 if(event.button===0){
  removeBlock(hit.object);
 }

 if(event.button===2){
  const normal=hit.face.normal.clone();
  normal.transformDirection(hit.object.matrixWorld);

  const pos=hit.object.position.clone().add(normal);

  const x=Math.round(pos.x);
  const y=Math.round(pos.y);
  const z=Math.round(pos.z);

  if(blocks.has(key(x,y,z)))return;

  const overlapsPlayer=
   Math.abs(x-camera.position.x)<.5+playerRadius&&
   Math.abs(z-camera.position.z)<.5+playerRadius&&
   y+.5>camera.position.y-playerHeight&&
   y-.5<camera.position.y;

  if(overlapsPlayer)return;

  addBlock(x,y,z,selectedBlock);
  scheduleSave();
 }
});

// =====================
// 3D STONE PICKAXE
// =====================

const pickScene=new THREE.Scene();
const pickCamera=new THREE.PerspectiveCamera(35,1,.1,100);
pickCamera.position.set(0,0,7);

const pickRenderer=new THREE.WebGLRenderer({alpha:true,antialias:true});
pickRenderer.setPixelRatio(Math.min(devicePixelRatio,2));
pickRenderer.setSize(190,190);
pickaxeHud.appendChild(pickRenderer.domElement);

pickScene.add(new THREE.HemisphereLight(0xffffff,0x49413a,2));

const pickLight=new THREE.DirectionalLight(0xffffff,3);
pickLight.position.set(3,5,6);
pickScene.add(pickLight);

const pickaxe=new THREE.Group();
pickScene.add(pickaxe);

const handle=new THREE.Mesh(
 new THREE.CylinderGeometry(.09,.13,1.9,7),
 new THREE.MeshStandardMaterial({color:0x986039,roughness:.85})
);

handle.rotation.z=-.55;
handle.position.set(-.2,-.15,0);
pickaxe.add(handle);

const stoneMaterial=new THREE.MeshStandardMaterial({
 color:0x555b61,
 roughness:1,
 flatShading:true
});

const stoneHead=new THREE.Mesh(
 new THREE.IcosahedronGeometry(.52,0),
 stoneMaterial
);

stoneHead.scale.set(1.65,.65,.7);
stoneHead.rotation.z=-.35;
stoneHead.position.set(.45,.72,0);
pickaxe.add(stoneHead);

const stoneTip=new THREE.Mesh(
 new THREE.ConeGeometry(.28,.65,5),
 stoneMaterial
);

stoneTip.rotation.z=-1.15;
stoneTip.position.set(1.05,.88,0);
pickaxe.add(stoneTip);

const binding=new THREE.Mesh(
 new THREE.CylinderGeometry(.15,.15,.22,8),
 new THREE.MeshStandardMaterial({color:0xb47743})
);

binding.position.set(-.05,.15,0);
binding.rotation.z=-.55;
pickaxe.add(binding);

pickaxe.rotation.z=-.25;
pickaxe.scale.setScalar(.85);

let pickaxeTime=0;

function animatePickaxe(){
 requestAnimationFrame(animatePickaxe);

 pickaxeTime+=.018;
 pickaxe.rotation.y+=.018;
 pickaxe.rotation.x=Math.sin(pickaxeTime)*.12;
 pickaxe.position.y=Math.sin(pickaxeTime*1.5)*.08;

 pickRenderer.render(pickScene,pickCamera);
}

animatePickaxe();

// =====================
// SAVE / RESET BUTTONS
// =====================

document.getElementById("saveBtn").addEventListener("click",()=>{
 if(hubMode){
  showMessage("Hub world cannot be saved!");
  return;
 }

 if(saveWorld()){
  showMessage("World saved successfully!");
 }
});

document.getElementById("resetBtn").addEventListener("click",()=>{
 if(hubMode){
  showMessage("Leave the hub before creating a new world.");
  return;
 }

 if(!confirm("Are you sure you want to create a new world?"))return;

 localStorage.removeItem(SAVE_KEY);
 generateWorld();

 camera.position.set(0,2.6,5);
 velocityY=0;
 canJump=false;
 yaw=0;
 pitch=0;

 updateCameraRotation();
 selectBlock("grass");
 saveWorld();

 showMessage("New world created!");
});

// =====================
// CODE MACHINE — OPERATOR
// =====================

const codeMachineInput = document.getElementById("codeMachineInput");
const codeMachineCheck = document.getElementById("codeMachineCheck");

const operatorMenu = document.getElementById("operatorMenu");
const operatorClose = document.getElementById("operatorClose");
const operatorInput = document.getElementById("operatorInput");
const operatorCheck = document.getElementById("operatorCheck");
const operatorMessage = document.getElementById("operatorMessage");

function openOperatorMenu(){
  operatorMenu.style.display = "block";
  operatorInput.value = "";
  operatorMessage.textContent = "";
  operatorInput.focus();
}

function closeOperatorMenu(){
  operatorMenu.style.display = "none";
}

codeMachineCheck.addEventListener("click", () => {
  const code = codeMachineInput.value.trim().toUpperCase();

  if(code === "OP" || code === "OPERATOR"){
    openOperatorMenu();
  }else{
    showMessage("INVALID CODE");
  }
});

codeMachineInput.addEventListener("keydown", event => {
  if(event.key === "Enter"){
    codeMachineCheck.click();
  }
});

operatorClose.addEventListener("click", closeOperatorMenu);

operatorCheck.addEventListener("click", () => {
  const code = operatorInput.value;

  if(code === "/voxelTRY"){
    window.location.href = "voxel.html";
  }else{
    operatorMessage.textContent = "INVALID CODE";
  }
});
 
// =====================
// GAME LOOP
// =====================

let lastTime=performance.now();

function animate(now){
 requestAnimationFrame(animate);

 const delta=Math.min((now-lastTime)/1000,.05);
 lastTime=now;

 if(isLocked)updatePlayer(delta);

 renderer.render(scene,camera);
}

requestAnimationFrame(animate);

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();

 renderer.setSize(innerWidth,innerHeight);

 pickCamera.aspect=1;
 pickCamera.updateProjectionMatrix();

 pickRenderer.setSize(pickaxeHud.clientWidth,pickaxeHud.clientHeight);
});

addEventListener("beforeunload",()=>{
 clearTimeout(saveTimer);

 if(!hubMode)saveWorld();
});
</script>

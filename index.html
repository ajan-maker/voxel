
<!DOCTYPE html>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;

}

}

#crosshair {

}

#top {
  position: fixed;

button {

}

button:hover {

}

/* MENU */
#overlay {

  z-index: 10;

  align-items: center;

  background-color: #777;

}

#panel {
  width: min(1000px, 96%);

}

#panel h1 {
  color: black;

}

#menuButtons {
  display: flex;

  gap: 20px;

}

#panel .menu-button {
  flex: 1;

  color: black;
  background-color: #a66d48;
  background-image:
    linear-gradient(#ffffff0c 1px, transparent 1px),
    linear-gradient(90deg, #00000018 1px, transparent 1px);
  background-size: 16px 16px;
  border: 3px solid #805132;

}

/* MENU PICKAXE */
#pickaxe-hud {
  position: fixed;
  right: 25px;
  bottom: 25px;
  width: 190px;
  height: 190px;
  pointer-events: none;

}

#pickaxe-hud canvas {
  display: block;
  width: 100%;
  height: 100%;
}

#message {
  position: fixed;
  top: 100px;

@media(max-width:600px) {
  #help {
    font-size: 10px;
  }

  .slot {
    width: 45px;
    height: 51px;
  }

  #buttons {
    top: 8px;
    right: 8px;
  }

  #logo {
    font-size: 24px;
  }

  #panel {
    padding: 8px;
  }

  #panel h1 {
    font-size: 50px;
    margin-bottom: 28px;
  }

  #menuButtons {
    gap: 10px;
  }

  #panel .menu-button {
    min-height: 90px;
    padding: 8px;
    font-size: 18px;
    overflow-wrap: anywhere;
  }

  #pickaxe-hud {
    right: 5px;
    bottom: 5px;
    width: 125px;
    height: 125px;
  }
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
  }
}
</script>
</head>

<body>

<div id="top">
  <div id="logo">voxel</div>
  <div id="status">WORLD READY</div>
</div>

<div id="buttons">
  <button id="saveBtn">SAVE WORLD</button>
</div>

<div id="crosshair">+</div>
<div id="hotbar"></div>

<div id="help">
  WASD — Move<br>
  SPACE — Jump<br>
  LEFT CLICK — Break block<br>
  RIGHT CLICK — Place block<br>
  1 / 2 / 3 — Select block<br>
  ESC — Return to menu
</div>

<div id="message"></div>

<div id="overlay">
  <div id="panel">
    <h1 id="menuTitle">VOXEL</h1>

    <div id="menuButtons">
      <button id="play" class="menu-button">JOIN WORLD</button>
      <button id="newWorld" class="menu-button">
        NEW WORLD<br>
        <span style="font-size:0.48em">
          (DELETES THE OLD ONE)
        </span>
      </button>
    </div>

    <button id="hubBack">BACK TO MENU</button>
  </div>
</div>

<script type="module">
import * as THREE from "three";

// =============================
// SCENE
// =============================

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 25, 65);

const camera = new THREE.PerspectiveCamera(
  75, innerWidth / innerHeight, 0.1, 1000
);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x667755, 2));

const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.position.set(15, 30, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
scene.add(sun);

// =============================
// BLOCK MATERIALS
// =============================

const materials = {
  grass: new THREE.MeshLambertMaterial({ color: 0x55ad43 }),
  dirt: new THREE.MeshLambertMaterial({ color: 0x80502e }),
  stone: new THREE.MeshLambertMaterial({ color: 0x858585 })
};

const blockNames = ["grass", "dirt", "stone"];
const blockColors = ["#55ad43", "#80502e", "#858585"];
const geometry = new THREE.BoxGeometry(1, 1, 1);
const blocks = new Map();

const SAVE_KEY = "voxel-world-v2";

let mode = "menu";
let isLocked = false;
let selectedBlock = "grass";
let yaw = 0;
let pitch = 0;
let velocityY = 0;
let canJump = false;
let saveTimer;
let messageTimeout;

const keys = {};
const playerRadius = 0.3;
const playerHeight = 1.8;

const key = (x, y, z) => `${x},${y},${z}`;

// =============================
// BLOCKS
// =============================

function addBlock(x, y, z, type) {
  const k = key(x, y, z);
  if (blocks.has(k)) return;

  const mesh = new THREE.Mesh(
    geometry,
    materials[type] || materials.grass
  );

  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.userData = { x, y, z, type };

  scene.add(mesh);
  blocks.set(k, mesh);
}

function clearWorld() {
  for (const mesh of blocks.values()) scene.remove(mesh);
  blocks.clear();
}

function generateWorld() {
  clearWorld();

  for (let x = -12; x < 12; x++) {
    for (let z = -12; z < 12; z++) {
      addBlock(x, 0, z, "grass");
      addBlock(x, -1, z, "dirt");
      addBlock(x, -2, z, "stone");
    }
  }

  const trees = [
    [-7, -6], [6, -8], [-8, 5], [8, 6], [3, 9]
  ];

  for (const [x, z] of trees) {
    for (let y = 1; y <= 3; y++) {
      addBlock(x, y, z, "dirt");
    }

    for (let dx = -1; dx <= 1; dx++) {
      for (let dz = -1; dz <= 1; dz++) {
        for (let y = 3; y <= 4; y++) {
          addBlock(x + dx, y, z + dz, "grass");
        }
      }
    }

    addBlock(x, 5, z, "grass");
  }
}

// =============================
// SAVE / LOAD
// =============================

function showMessage(text) {
  const el = document.getElementById("message");
  el.textContent = text;
  el.style.opacity = "1";

  clearTimeout(messageTimeout);
  messageTimeout = setTimeout(() => {
    el.style.opacity = "0";
  }, 1800);
}

function saveWorld() {
  if (mode === "hub") return false;

  try {
    const data = [...blocks.values()].map(mesh => {
      const { x, y, z, type } = mesh.userData;
      return [x, y, z, type];
    });

    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    document.getElementById("status").textContent = "WORLD SAVED ✓";
    return true;
  } catch (error) {
    showMessage("Could not save world!");
    return false;
  }
}

function scheduleSave() {
  if (mode !== "world") return;

  document.getElementById("status").textContent = "UNSAVED CHANGES";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveWorld, 400);
}

function loadSavedWorld() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);

    if (raw) {
      const data = JSON.parse(raw);

      if (Array.isArray(data) && data.length > 0 && data.length < 10000) {
        clearWorld();

        for (const item of data) {
          if (!Array.isArray(item) || item.length !== 4) continue;

          const [x, y, z, type] = item;

          if (
            Number.isInteger(x) &&
            Number.isInteger(y) &&
            Number.isInteger(z) &&
            Math.abs(x) <= 100 &&
            Math.abs(y) <= 100 &&
            Math.abs(z) <= 100 &&
            blockNames.includes(type)
          ) {
            addBlock(x, y, z, type);
          }
        }

        if (blocks.size > 0) return;
      }
    }
  } catch (error) {
    console.warn("Save could not be loaded.", error);
  }

  generateWorld();
  saveWorld();
}

// =============================
// HUB: 10 x 10, HEIGHT 5
// IMMUTABLE AND NEVER SAVED
// =============================

function generateHub() {
  clearWorld();

  // Exactly 10 x 10 stone blocks, five layers tall.
  for (let x = -5; x < 5; x++) {
    for (let z = -5; z < 5; z++) {
      for (let y = 0; y < 5; y++) {
        addBlock(x, y, z, "stone");
      }
    }
  }

  document.getElementById("status").textContent = "HUB — BUILDING DISABLED";
}

// =============================
// PLAYER MOVEMENT
// =============================

camera.position.set(0, 2.6, 5);

function updateCameraRotation() {
  camera.rotation.order = "YXZ";
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;
}

function collidesAt(px, py, pz) {
  const minX = Math.floor(px - playerRadius + 0.5);
  const maxX = Math.floor(px + playerRadius + 0.5);
  const minY = Math.floor(py - playerHeight + 0.5);
  const maxY = Math.floor(py + 0.1 + 0.5);
  const minZ = Math.floor(pz - playerRadius + 0.5);
  const maxZ = Math.floor(pz + playerRadius + 0.5);

  for (let x = minX; x <= maxX; x++) {
    for (let y = minY; y <= maxY; y++) {
      for (let z = minZ; z <= maxZ; z++) {
        if (blocks.has(key(x, y, z))) return true;
      }
    }
  }

  return false;
}

function updatePlayer(delta) {
  const speed = 5.5;

  const forward = new THREE.Vector3(
    -Math.sin(yaw), 0, -Math.cos(yaw)
  );

  const right = new THREE.Vector3(
    Math.cos(yaw), 0, -Math.sin(yaw)
  );

  const direction = new THREE.Vector3();

  if (keys.KeyW) direction.add(forward);
  if (keys.KeyS) direction.sub(forward);
  if (keys.KeyD) direction.add(right);
  if (keys.KeyA) direction.sub(right);

  if (direction.lengthSq() > 0) {
    direction.normalize().multiplyScalar(speed * delta);

    const nx = camera.position.x + direction.x;

    if (!collidesAt(nx, camera.position.y, camera.position.z)) {
      camera.position.x = nx;
    }

    const nz = camera.position.z + direction.z;

    if (!collidesAt(camera.position.x, camera.position.y, nz)) {
      camera.position.z = nz;
    }
  }

  velocityY -= 18 * delta;

  const ny = camera.position.y + velocityY * delta;

  if (collidesAt(camera.position.x, ny, camera.position.z)) {
    if (velocityY < 0) canJump = true;
    velocityY = 0;
  } else {
    canJump = false;
    camera.position.y = ny;
  }

  if (camera.position.y < -20) {
    camera.position.set(0, 2.6, 5);
    velocityY = 0;
  }
}

// =============================
// HOTBAR
// =============================

const hotbar = document.getElementById("hotbar");

blockNames.forEach((type, i) => {
  const slot = document.createElement("div");

  slot.className = "slot" + (i === 0 ? " selected" : "");

  slot.innerHTML =
    `<div class="swatch" style="background:${blockColors[i]}"></div>` +
    `${i + 1}: ${type.toUpperCase()}`;

  slot.addEventListener("click", () => selectBlock(type));
  hotbar.appendChild(slot);
});

function selectBlock(type) {
  selectedBlock = type;

  [...hotbar.children].forEach((slot, i) => {
    slot.classList.toggle("selected", blockNames[i] === type);
  });
}

// =============================
// MENU AND GAME MODES
// =============================

const overlay = document.getElementById("overlay");
const menuTitle = document.getElementById("menuTitle");
const menuButtons = document.getElementById("menuButtons");
const hubBack = document.getElementById("hubBack");

const pickaxeHud = document.createElement("div");
pickaxeHud.id = "pickaxe-hud";
document.body.appendChild(pickaxeHud);

function showMainMenu() {
  mode = "menu";
  overlay.style.display = "flex";
  menuTitle.textContent = "VOXEL";
  menuButtons.style.display = "flex";
  hubBack.style.display = "none";
  pickaxeHud.style.display = "block";

  document.getElementById("top").style.display = "none";
  document.getElementById("buttons").style.display = "none";
  document.getElementById("hotbar").style.display = "none";
  document.getElementById("help").style.display = "none";
  document.getElementById("crosshair").style.display = "none";
}

function showGameHUD() {
  document.getElementById("top").style.display = "block";
  document.getElementById("buttons").style.display =
    mode === "world" ? "flex" : "none";
  document.getElementById("hotbar").style.display =
    mode === "world" ? "flex" : "none";
  document.getElementById("help").style.display =
    mode === "world" ? "block" : "none";
  document.getElementById("crosshair").style.display = "block";
}

function enterWorld(isNew) {
  if (isNew) {
    // Remove the previous saved world, then generate and save a fresh one.
    localStorage.removeItem(SAVE_KEY);
    generateWorld();
    saveWorld();
  } else {
    // Load existing save; create a default world if no save exists.
    loadSavedWorld();
  }

  mode = "world";
  camera.position.set(0, 2.6, 5);
  yaw = 0;
  pitch = 0;
  velocityY = 0;
  updateCameraRotation();

  overlay.style.display = "none";
  pickaxeHud.style.display = "none";
  showGameHUD();

  // Clicking JOIN WORLD enters the game without needing a second click.
  renderer.domElement.requestPointerLock();
}

function enterHub() {
  if (document.pointerLockElement) {
    document.exitPointerLock();
  }

  mode = "hub";
  generateHub();

  camera.position.set(0, 7, 14);
  yaw = 0;
  pitch = -0.15;
  updateCameraRotation();

  overlay.style.display = "flex";
  menuTitle.textContent = "HUB";
  menuButtons.style.display = "none";
  hubBack.style.display = "inline-block";
  pickaxeHud.style.display = "block";

  showGameHUD();
  document.getElementById("buttons").style.display = "none";
  document.getElementById("hotbar").style.display = "none";
  document.getElementById("help").style.display = "none";
}

function leaveHub() {
  showMainMenu();

  // Restore the saved world in memory after leaving the temporary hub.
  loadSavedWorld();
}

document.getElementById("play").addEventListener("click", () => {
  enterWorld(false);
});

document.getElementById("newWorld").addEventListener("click", () => {
  if (!confirm("NEW WORLD will delete your old saved world. Continue?")) {
    return;
  }

  enterWorld(true);
});

document.getElementById("joinHub").addEventListener("click", enterHub);
hubBack.addEventListener("click", leaveHub);

document.addEventListener("pointerlockchange", () => {
  isLocked = document.pointerLockElement === renderer.domElement;

  if (isLocked) {
    overlay.style.display = "none";
    pickaxeHud.style.display = "none";
  } else if (mode === "world") {
    // ESC pauses the game and returns to the main menu.
    showMainMenu();
  }
});

document.addEventListener("mousemove", event => {
  if (!isLocked) return;

  yaw -= event.movementX * 0.002;
  pitch -= event.movementY * 0.002;

  pitch = Math.max(
    -Math.PI / 2 + 0.01,
    Math.min(Math.PI / 2 - 0.01, pitch)
  );

  updateCameraRotation();
});

document.addEventListener("keydown", event => {
  keys[event.code] = true;

  if (["Space", "ArrowUp", "ArrowDown"].includes(event.code)) {
    event.preventDefault();
  }

  if (event.code === "Space" && canJump && isLocked && mode === "world") {
    velocityY = 7;
    canJump = false;
  }

  if (mode === "world") {
    if (event.code === "Digit1") selectBlock("grass");
    if (event.code === "Digit2") selectBlock("dirt");
    if (event.code === "Digit3") selectBlock("stone");
  }
});

document.addEventListener("keyup", event => {
  keys[event.code] = false;
});

document.addEventListener("contextmenu", event => {
  event.preventDefault();
});

// =============================
// BREAK AND PLACE
// ONLY IN NORMAL WORLD
// =============================

const raycaster = new THREE.Raycaster();
raycaster.far = 6;

function getTargetBlock() {
  raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

  const hits = raycaster.intersectObjects([...blocks.values()], false);
  return hits.length ? hits[0] : null;
}

document.addEventListener("mousedown", event => {
  if (!isLocked || mode !== "world") return;

  const hit = getTargetBlock();
  if (!hit) return;

  if (event.button === 0) {
    const { x, y, z } = hit.object.userData;

    scene.remove(hit.object);
    blocks.delete(key(x, y, z));
    scheduleSave();
  }

  if (event.button === 2) {
    const normal = hit.face.normal.clone();
    normal.transformDirection(hit.object.matrixWorld);

    const pos = hit.object.position.clone().add(normal);

    const px = camera.position.x;
    const pz = camera.position.z;

    const overlapsPlayer =
      Math.abs(pos.x - px) < 0.5 + playerRadius &&
      Math.abs(pos.z - pz) < 0.5 + playerRadius &&
      Math.abs(pos.y - camera.position.y) < 1.45;

    if (overlapsPlayer) return;

    addBlock(
      Math.round(pos.x),
      Math.round(pos.y),
      Math.round(pos.z),
      selectedBlock
    );

    scheduleSave();
  }
});

// =============================
// 3D PICKAXE - MENU ONLY
// =============================

const pickScene = new THREE.Scene();
const pickCamera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
pickCamera.position.set(0, 0, 7);

const pickRenderer = new THREE.WebGLRenderer({
  alpha: true,
  antialias: true
});

pickRenderer.setPixelRatio(Math.min(devicePixelRatio, 2));
pickRenderer.setSize(190, 190);
pickRenderer.setClearColor(0x000000, 0);
pickaxeHud.appendChild(pickRenderer.domElement);

pickScene.add(new THREE.HemisphereLight(0xffffff, 0x49413a, 2));

const pickLight = new THREE.DirectionalLight(0xffffff, 3);
pickLight.position.set(3, 5, 6);
pickScene.add(pickLight);

const pickaxe = new THREE.Group();
pickScene.add(pickaxe);

const handle = new THREE.Mesh(
  new THREE.CylinderGeometry(0.09, 0.13, 1.9, 7),
  new THREE.MeshStandardMaterial({
    color: 0x986039,
    roughness: 0.85
  })
);

handle.rotation.z = -0.55;
handle.position.set(-0.2, -0.15, 0);
pickaxe.add(handle);

const stoneMaterial = new THREE.MeshStandardMaterial({
  color: 0x555b61,
  roughness: 1,
  flatShading: true
});

const stoneHead = new THREE.Mesh(
  new THREE.IcosahedronGeometry(0.52, 0),
  stoneMaterial
);

stoneHead.scale.set(1.65, 0.65, 0.7);
stoneHead.rotation.z = -0.35;
stoneHead.position.set(0.45, 0.72, 0);
pickaxe.add(stoneHead);

const stoneTip = new THREE.Mesh(
  new THREE.ConeGeometry(0.28, 0.65, 5),
  stoneMaterial
);

stoneTip.rotation.z = -1.15;
stoneTip.position.set(1.05, 0.88, 0);
pickaxe.add(stoneTip);

const binding = new THREE.Mesh(
  new THREE.CylinderGeometry(0.15, 0.15, 0.22, 8),
  new THREE.MeshStandardMaterial({ color: 0xb47743 })
);

binding.position.set(-0.05, 0.15, 0);
binding.rotation.z = -0.55;
pickaxe.add(binding);

pickaxe.rotation.z = -0.25;
pickaxe.scale.setScalar(0.85);

let pickaxeTime = 0;

function animatePickaxe() {
  requestAnimationFrame(animatePickaxe);

  pickaxeTime += 0.018;
  pickaxe.rotation.y += 0.018;
  pickaxe.rotation.x = Math.sin(pickaxeTime) * 0.12;
  pickaxe.position.y = Math.sin(pickaxeTime * 1.5) * 0.08;

  pickRenderer.render(pickScene, pickCamera);
}

animatePickaxe();

// =============================
// BUTTONS
// =============================

document.getElementById("saveBtn").addEventListener("click", () => {
  if (mode === "world" && saveWorld()) {
    showMessage("World saved successfully!");
  }
});

// =============================
// GAME LOOP
// =============================

let lastTime = performance.now();

function animate(now) {
  requestAnimationFrame(animate);

  const delta = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  if (isLocked && mode === "world") {
    updatePlayer(delta);
  }

  // Hub camera is fixed, and hub blocks cannot be edited.
  renderer.render(scene, camera);
}

requestAnimationFrame(animate);

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);

  pickCamera.aspect = 1;
  pickCamera.updateProjectionMatrix();

  pickRenderer.setSize(
    pickaxeHud.clientWidth,
    pickaxeHud.clientHeight
  );
});

addEventListener("beforeunload", () => {
  clearTimeout(saveTimer);

  if (mode === "world") saveWorld();
});

// Start in the main menu.
clearWorld();
showMainMenu();
</script>

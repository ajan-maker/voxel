
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VOXEL</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:Arial,sans-serif;background:#87ceeb;color:white}
canvas{display:block}
#top{position:fixed;top:12px;left:50%;transform:translateX(-50%);text-align:center;text-shadow:2px 2px 4px #000;pointer-events:none;z-index:2}
#logo{font-size:30px;font-weight:900;letter-spacing:5px}
#status{font-size:12px;margin-top:6px}
#crosshair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:25px;text-shadow:1px 1px 3px black;pointer-events:none;z-index:2}
#buttons{position:fixed;top:12px;right:12px;z-index:3}
button{cursor:pointer;font-weight:bold;padding:10px 14px;background:#222d;border:1px solid #ffffff66;color:white}
button:hover{background:#555e}
#hotbar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:2}
.slot{width:58px;height:58px;border:3px solid #777;background:#222b;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:10px;cursor:pointer}
.slot.selected{border-color:white;background:#ffffff44;transform:translateY(-5px)}
.swatch{width:25px;height:25px;margin-bottom:4px;border:2px solid #0005}
#help{position:fixed;left:12px;bottom:12px;font-size:12px;line-height:1.8;background:#0009;padding:10px;pointer-events:none;z-index:2}
#message{position:fixed;top:90px;left:50%;transform:translateX(-50%);padding:9px 15px;background:#0009;border-radius:5px;opacity:0;pointer-events:none;z-index:12}
#overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#777;background-image:linear-gradient(#0002 1px,transparent 1px),linear-gradient(90deg,#0002 1px,transparent 1px);background-size:32px 32px}
#panel{width:min(1000px,96%);padding:20px;text-align:center}
#panel h1{color:#111;font-size:clamp(55px,9vw,100px);font-weight:900;letter-spacing:10px;margin:0 0 38px;text-shadow:2px 2px 0 #aaa}
#menuButtons{display:flex;justify-content:center;align-items:stretch;gap:20px;width:100%}
.menu-button{flex:1;min-width:0;min-height:115px;padding:15px;color:#17100b;background-color:#a66d48;background-image:linear-gradient(#ffffff0c 1px,transparent 1px),linear-gradient(90deg,#00000018 1px,transparent 1px);background-size:16px 16px;border:3px solid #805132;border-radius:0;font-size:clamp(19px,3vw,38px);font-weight:400}
.menu-button:hover{background-color:#bd8259}
#backButton{display:none;margin-top:22px;background:#a66d48;color:#17100b;border:2px solid #805132;border-radius:0;font-size:20px;padding:12px 30px}
#pickaxe-hud{position:fixed;right:25px;bottom:25px;width:190px;height:190px;pointer-events:none;z-index:11}
#pickaxe-hud canvas{width:100%;height:100%;display:block}
@media(max-width:600px){
 #panel{padding:8px}
 #panel h1{font-size:50px;margin-bottom:25px}
 #menuButtons{gap:10px}
 .menu-button{min-height:90px;padding:8px;font-size:18px;overflow-wrap:anywhere}
 #hotbar{gap:3px}
 .slot{width:45px;height:50px}
 #help{font-size:10px}
 #pickaxe-hud{right:5px;bottom:5px;width:125px;height:125px}
}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}
</script>
</head>
<body>
<div id="top"><div id="logo">voxel</div><div id="status">WORLD READY</div></div>
<div id="buttons"><button id="saveBtn">SAVE WORLD</button></div>
<div id="crosshair">+</div>
<div id="hotbar"></div>
<div id="help">WASD — Move<br>SPACE — Jump<br>LEFT CLICK — Break block<br>RIGHT CLICK — Place block<br>1 / 2 / 3 — Select block<br>ESC — Menu</div>
<div id="message"></div>

<div id="overlay">
 <div id="panel">
  <h1 id="menuTitle">VOXEL</h1>
  <div id="menuButtons"></div>
  <button id="backButton">BACK</button>
 </div>
</div>

<script type="module">
import * as THREE from "three";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb,25,65);

const camera = new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,1000);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x667755,2));
const sun = new THREE.DirectionalLight(0xffffff,2);
sun.position.set(15,30,10);
sun.castShadow = true;
scene.add(sun);

const materials = {
 grass:new THREE.MeshLambertMaterial({color:0x55ad43}),
 dirt:new THREE.MeshLambertMaterial({color:0x80502e}),
 stone:new THREE.MeshLambertMaterial({color:0x858585})
};
const types = ["grass","dirt","stone"];
const colors = ["#55ad43","#80502e","#858585"];
const geometry = new THREE.BoxGeometry(1,1,1);
const blocks = new Map();
const SAVE_KEY = "voxel-world-v3";
const key = (x,y,z) => `${x},${y},${z}`;

let mode = "menu";
let menuPage = "main";
let isLocked = false;
let selectedBlock = "grass";
let yaw = 0, pitch = 0, velocityY = 0, canJump = false;
let saveTimer, messageTimer;
const keys = {};
const playerRadius = .3, playerHeight = 1.8;

function addBlock(x,y,z,type) {
 const k = key(x,y,z);
 if (blocks.has(k)) return;
 const mesh = new THREE.Mesh(geometry,materials[type]||materials.grass);
 mesh.position.set(x,y,z);
 mesh.castShadow = true;
 mesh.receiveShadow = true;
 mesh.userData = {x,y,z,type};
 scene.add(mesh);
 blocks.set(k,mesh);
}

function clearWorld() {
 for (const mesh of blocks.values()) scene.remove(mesh);
 blocks.clear();
}

function generateWorld() {
 clearWorld();
 for (let x=-12;x<12;x++) {
  for (let z=-12;z<12;z++) {
   addBlock(x,0,z,"grass");
   addBlock(x,-1,z,"dirt");
   addBlock(x,-2,z,"stone");
  }
 }
 for (const [x,z] of [[-7,-6],[6,-8],[-8,5],[8,6],[3,9]]) {
  for (let y=1;y<=3;y++) addBlock(x,y,z,"dirt");
  for (let dx=-1;dx<=1;dx++) {
   for (let dz=-1;dz<=1;dz++) {
    for (let y=3;y<=4;y++) addBlock(x+dx,y,z+dz,"grass");
   }
  }
  addBlock(x,5,z,"grass");
 }
}

// HUB: separate temporary area, not saved
function generateHub() {
 clearWorld();
 for (let x=-5;x<5;x++) {
  for (let z=-5;z<5;z++) {
   for (let y=0;y<5;y++) addBlock(x,y,z,"stone");
  }
 }
 document.getElementById("status").textContent = "HUB — BUILDING DISABLED";
}

function showMessage(text) {
 const el = document.getElementById("message");
 el.textContent = text;
 el.style.opacity = 1;
 clearTimeout(messageTimer);
 messageTimer = setTimeout(()=>el.style.opacity=0,1800);
}

function saveWorld() {
 if (mode==="hub") return false;
 try {
  const data = [...blocks.values()].map(mesh=>{
   const {x,y,z,type}=mesh.userData;
   return [x,y,z,type];
  });
  localStorage.setItem(SAVE_KEY,JSON.stringify(data));
  document.getElementById("status").textContent="WORLD SAVED ✓";
  return true;
 } catch(e) {
  showMessage("Could not save world!");
  return false;
 }
}

function scheduleSave() {
 if (mode!=="world") return;
 document.getElementById("status").textContent="UNSAVED CHANGES";
 clearTimeout(saveTimer);
 saveTimer=setTimeout(saveWorld,400);
}

function loadSavedWorld() {
 try {
  const raw=localStorage.getItem(SAVE_KEY);
  if (raw) {
   const data=JSON.parse(raw);
   if (Array.isArray(data)&&data.length>0&&data.length<10000) {
    clearWorld();
    for (const item of data) {
     if (!Array.isArray(item)||item.length!==4) continue;
     const [x,y,z,type]=item;
     if (Number.isInteger(x)&&Number.isInteger(y)&&Number.isInteger(z)&&
         Math.abs(x)<=100&&Math.abs(y)<=100&&Math.abs(z)<=100&&types.includes(type)) {
      addBlock(x,y,z,type);
     }
    }
    if (blocks.size) return true;
   }
  }
 } catch(e) {
  console.warn("Save could not be loaded",e);
 }
 generateWorld();
 saveWorld();
 return false;
}

camera.position.set(0,2.6,5);

function updateRotation() {
 camera.rotation.order="YXZ";
 camera.rotation.y=yaw;
 camera.rotation.x=pitch;
}

function collidesAt(px,py,pz) {
 const minX=Math.floor(px-playerRadius+.5),maxX=Math.floor(px+playerRadius+.5);
 const minY=Math.floor(py-playerHeight+.5),maxY=Math.floor(py+.1+.5);
 const minZ=Math.floor(pz-playerRadius+.5),maxZ=Math.floor(pz+playerRadius+.5);
 for (let x=minX;x<=maxX;x++) {
  for (let y=minY;y<=maxY;y++) {
   for (let z=minZ;z<=maxZ;z++) {
    if (blocks.has(key(x,y,z))) return true;
   }
  }
 }
 return false;
}

function updatePlayer(dt) {
 const speed=5.5;
 const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
 const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
 const d=new THREE.Vector3();
 if(keys.KeyW)d.add(forward);
 if(keys.KeyS)d.sub(forward);
 if(keys.KeyD)d.add(right);
 if(keys.KeyA)d.sub(right);
 if(d.lengthSq()) {
  d.normalize().multiplyScalar(speed*dt);
  const nx=camera.position.x+d.x;
  if(!collidesAt(nx,camera.position.y,camera.position.z))camera.position.x=nx;
  const nz=camera.position.z+d.z;
  if(!collidesAt(camera.position.x,camera.position.y,nz))camera.position.z=nz;
 }
 velocityY-=18*dt;
 const ny=camera.position.y+velocityY*dt;
 if(collidesAt(camera.position.x,ny,camera.position.z)) {
  if(velocityY<0)canJump=true;
  velocityY=0;
 } else {
  canJump=false;
  camera.position.y=ny;
 }
 if(camera.position.y < -20) {
  camera.position.set(0,2.6,5);
  velocityY=0;
 }
}

// HOTBAR
const hotbar=document.getElementById("hotbar");
types.forEach((type,i)=>{
 const el=document.createElement("div");
 el.className="slot"+(i===0?" selected":"");
 el.innerHTML=`<div class="swatch" style="background:${colors[i]}"></div>${i+1}: ${type.toUpperCase()}`;
 el.onclick=()=>selectBlock(type);
 hotbar.appendChild(el);
});

function selectBlock(type) {
 selectedBlock=type;
 [...hotbar.children].forEach((el,i)=>el.classList.toggle("selected",types[i]===type));
}

// MENU
const overlay=document.getElementById("overlay");
const menuTitle=document.getElementById("menuTitle");
const menuButtons=document.getElementById("menuButtons");
const backButton=document.getElementById("backButton");
const topUI=document.getElementById("top");
const topButtons=document.getElementById("buttons");
const help=document.getElementById("help");
const crosshair=document.getElementById("crosshair");

const pickaxeHud=document.createElement("div");
pickaxeHud.id="pickaxe-hud";
document.body.appendChild(pickaxeHud);

function makeMenuButton(html,callback) {
 const b=document.createElement("button");
 b.className="menu-button";
 b.innerHTML=html;
 b.onclick=callback;
 return b;
}

function showMenu(page="main") {
 if (mode==="world") {
  clearTimeout(saveTimer);
  saveWorld();
 }
 if (document.pointerLockElement) document.exitPointerLock();

 mode="menu";
 menuPage=page;
 overlay.style.display="flex";
 menuTitle.textContent=page==="main"?"VOXEL":"JOIN WORLD";
 menuButtons.innerHTML="";

 if(page==="main") {
  menuButtons.append(
   makeMenuButton("HUB",enterHub),
   makeMenuButton("JOIN WORLD",()=>showMenu("world"))
  );
 } else {
  menuButtons.append(
   makeMenuButton("JOIN WORLD",joinWorld),
   makeMenuButton("NEW WORLD<br><span style='font-size:.48em'>(DELETES THE OLD ONE)</span>",createNewWorld)
  );
 }

 backButton.style.display=page==="world"?"inline-block":"none";
 backButton.onclick=()=>showMenu("main");
 pickaxeHud.style.display="block";
 topUI.style.display="none";
 topButtons.style.display="none";
 hotbar.style.display="none";
 help.style.display="none";
 crosshair.style.display="none";
}

function showGameHUD() {
 topUI.style.display="block";
 topButtons.style.display=mode==="world"?"block":"none";
 hotbar.style.display=mode==="world"?"flex":"none";
 help.style.display=mode==="world"?"block":"none";
 crosshair.style.display="block";
}

function startWorld() {
 mode="world";
 camera.position.set(0,2.6,5);
 yaw=0;pitch=0;velocityY=0;
 updateRotation();
 overlay.style.display="none";
 pickaxeHud.style.display="none";
 showGameHUD();
 renderer.domElement.requestPointerLock();
}

function joinWorld() {
 clearTimeout(saveTimer);
 loadSavedWorld();
 startWorld();
}

function createNewWorld() {
 if(!confirm("NEW WORLD will delete your old saved world. Continue?"))return;
 clearTimeout(saveTimer);
 localStorage.removeItem(SAVE_KEY);
 generateWorld();
 mode="world";
 saveWorld();
 startWorld();
}

// HUB ENTRY
function enterHub() {
 clearTimeout(saveTimer);
 if(document.pointerLockElement) document.exitPointerLock();

 mode="hub";
 generateHub();

 camera.position.set(0,7,14);
 yaw=0;
 pitch=-0.15;
 velocityY=0;
 updateRotation();

 overlay.style.display="none";
 pickaxeHud.style.display="none";
 topUI.style.display="block";
 topButtons.style.display="none";
 hotbar.style.display="none";
 help.style.display="none";
 crosshair.style.display="block";

 document.getElementById("status").textContent="HUB — BUILDING DISABLED";
 showMessage("HUB — BUILDING DISABLED");
}

document.getElementById("hubButton").onclick=enterHub;
document.getElementById("worldMenuButton").onclick=()=>showMenu("world");

// ESC: HUB goes to main menu; normal world opens world menu
document.addEventListener("pointerlockchange",()=>{
 isLocked=document.pointerLockElement===renderer.domElement;
 if(isLocked) {
  overlay.style.display="none";
  pickaxeHud.style.display="none";
 } else if(mode==="world") {
  showMenu("world");
 }
});

document.addEventListener("mousemove",e=>{
 if(!isLocked)return;
 yaw-=e.movementX*.002;
 pitch-=e.movementY*.002;
 pitch=Math.max(-Math.PI/2+.01,Math.min(Math.PI/2-.01,pitch));
 updateRotation();
});

document.addEventListener("keydown",e=>{
 keys[e.code]=true;
 if(["Space","ArrowUp","ArrowDown"].includes(e.code))e.preventDefault();

 if(e.code==="Escape"&&mode==="hub") {
  showMenu("main");
  return;
 }

 if(e.code==="Space"&&canJump&&isLocked&&mode==="world") {
  velocityY=7;
  canJump=false;
 }

 if(mode==="world") {
  if(e.code==="Digit1")selectBlock("grass");
  if(e.code==="Digit2")selectBlock("dirt");
  if(e.code==="Digit3")selectBlock("stone");
 }
});

document.addEventListener("keyup",e=>keys[e.code]=false);
document.addEventListener("contextmenu",e=>e.preventDefault());

// BREAK / PLACE: NORMAL WORLD ONLY
const raycaster=new THREE.Raycaster();
raycaster.far=6;

function targetBlock() {
 raycaster.setFromCamera(new THREE.Vector2(0,0),camera);
 const hits=raycaster.intersectObjects([...blocks.values()],false);
 return hits.length?hits[0]:null;
}

document.addEventListener("mousedown",e=>{
 if(!isLocked||mode!=="world")return;
 const hit=targetBlock();
 if(!hit)return;

 if(e.button===0) {
  const {x,y,z}=hit.object.userData;
  scene.remove(hit.object);
  blocks.delete(key(x,y,z));
  scheduleSave();
 }

 if(e.button===2) {
  const normal=hit.face.normal.clone().transformDirection(hit.object.matrixWorld);
  const p=hit.object.position.clone().add(normal);

  if(Math.abs(p.x-camera.position.x)<.5+playerRadius&&
     Math.abs(p.z-camera.position.z)<.5+playerRadius&&
     Math.abs(p.y-camera.position.y)<1.45)return;

  addBlock(Math.round(p.x),Math.round(p.y),Math.round(p.z),selectedBlock);
  scheduleSave();
 }
});

// ROTATING PICKAXE IN MENUS
const pickScene=new THREE.Scene();
const pickCamera=new THREE.PerspectiveCamera(35,1,.1,100);
pickCamera.position.set(0,0,7);

const pickRenderer=new THREE.WebGLRenderer({alpha:true,antialias:true});
pickRenderer.setPixelRatio(Math.min(devicePixelRatio,2));
pickRenderer.setSize(190,190);
pickRenderer.setClearColor(0,0);
pickaxeHud.appendChild(pickRenderer.domElement);

pickScene.add(new THREE.HemisphereLight(0xffffff,0x49413a,2));
const light=new THREE.DirectionalLight(0xffffff,3);
light.position.set(3,5,6);
pickScene.add(light);

const pickaxe=new THREE.Group();
pickScene.add(pickaxe);

const handle=new THREE.Mesh(
 new THREE.CylinderGeometry(.09,.13,1.9,7),
 new THREE.MeshStandardMaterial({color:0x986039,roughness:.85})
);
handle.rotation.z=-.55;
handle.position.set(-.2,-.15,0);
pickaxe.add(handle);

const stoneMat=new THREE.MeshStandardMaterial({color:0x555b61,roughness:1,flatShading:true});
const head=new THREE.Mesh(new THREE.IcosahedronGeometry(.52,0),stoneMat);
head.scale.set(1.65,.65,.7);
head.rotation.z=-.35;
head.position.set(.45,.72,0);
pickaxe.add(head);

const tip=new THREE.Mesh(new THREE.ConeGeometry(.28,.65,5),stoneMat);
tip.rotation.z=-1.15;
tip.position.set(1.05,.88,0);
pickaxe.add(tip);

const binding=new THREE.Mesh(
 new THREE.CylinderGeometry(.15,.15,.22,8),
 new THREE.MeshStandardMaterial({color:0xb47743})
);
binding.position.set(-.05,.15,0);
binding.rotation.z=-.55;
pickaxe.add(binding);

pickaxe.rotation.z=-.25;
pickaxe.scale.setScalar(.85);

let pickTime=0;
function animatePickaxe() {
 requestAnimationFrame(animatePickaxe);
 pickTime+=.018;
 pickaxe.rotation.y+=.018;
 pickaxe.rotation.x=Math.sin(pickTime)*.12;
 pickaxe.position.y=Math.sin(pickTime*1.5)*.08;
 pickRenderer.render(pickScene,pickCamera);
}
animatePickaxe();

// SAVE BUTTON
document.getElementById("saveBtn").onclick=()=>{
 if(mode==="world"&&saveWorld())showMessage("World saved!");
};

// MAIN LOOP
let last=performance.now();
function animate(now) {
 requestAnimationFrame(animate);
 const dt=Math.min((now-last)/1000,.05);
 last=now;
 if(isLocked&&mode==="world")updatePlayer(dt);
 renderer.render(scene,camera);
}
requestAnimationFrame(animate);

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
 pickRenderer.setSize(pickaxeHud.clientWidth,pickaxeHud.clientHeight);
});

addEventListener("beforeunload",()=>{
 clearTimeout(saveTimer);
 if(mode==="world")saveWorld();
});

clearWorld();
showMenu("main");
</script>
</body>
</html>

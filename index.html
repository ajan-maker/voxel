<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOXEL</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  overflow: hidden;
  background: #87ceeb;
  font-family: Arial, sans-serif;
}

canvas {
  display: block;
}

#overlay {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.58);
}

#menu {
  text-align: center;
  color: white;
}

#title {
  font-size: clamp(55px, 10vw, 100px);
  font-weight: 1000;
  letter-spacing: 8px;
  margin-bottom: 35px;
  text-shadow: 5px 5px 0 #444;
}

.menuButton {
  display: block;
  width: 270px;
  margin: 12px auto;
  padding: 17px;
  border: 3px solid #111;
  background: #777;
  color: white;
  font-size: 19px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: inset 0 0 0 2px #aaa;
}

.menuButton:hover {
  background: #999;
}

#crosshair {
  position: fixed;
  left: 50%;
  top: 50%;
  transform: translate(-50%,-50%);
  color: white;
  font-size: 27px;
  text-shadow: 1px 1px 3px black;
  pointer-events: none;
  z-index: 3;
  display: none;
}

#hotbar {
  position: fixed;
  left: 50%;
  bottom: 20px;
  transform: translateX(-50%);
  display: flex;
  gap: 5px;
  z-index: 4;
  display: none;
}

.slot {
  width: 54px;
  height: 54px;
  border: 3px solid #444;
  background: rgba(30,30,30,.8);
  display: flex;
  align-items: center;
  justify-content: center;
}

.slot.selected {
  border: 4px solid white;
}

.blockIcon {
  width: 30px;
  height: 30px;
  border: 2px solid rgba(0,0,0,.3);
}

#status {
  position: fixed;
  top: 15px;
  left: 15px;
  z-index: 5;
  color: white;
  font-weight: bold;
  font-size: 16px;
  text-shadow: 2px 2px 3px black;
  pointer-events: none;
}

#help {
  position: fixed;
  left: 15px;
  bottom: 15px;
  color: white;
  text-shadow: 1px 1px 3px black;
  font-size: 13px;
  line-height: 1.7;
  z-index: 5;
  display: none;
  pointer-events: none;
}

#worldButtons {
  position: fixed;
  right: 15px;
  top: 15px;
  z-index: 6;
  display: none;
}

.smallButton {
  display: block;
  margin-bottom: 8px;
  padding: 9px 13px;
  background: rgba(70,70,70,.85);
  border: 2px solid #222;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.smallButton:hover {
  background: #888;
}

#pickaxeHud {
  position: fixed;
  right: 45px;
  bottom: 50px;
  z-index: 7;
  font-size: 75px;
  transform: rotate(-35deg);
  display: none;
  pointer-events: none;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
  }
}
</script>
</head>

<body>

<div id="overlay">
  <div id="menu">
    <div id="title">VOXEL</div>
    <button class="menuButton" id="play">JOIN WORLD</button>
    <button class="menuButton" id="joinHub">JOIN HUB</button>
  </div>
</div>

<div id="status">VOXEL</div>
<div id="crosshair">+</div>

<div id="hotbar">
  <div class="slot selected" data-slot="1">
    <div class="blockIcon" style="background:#579642"></div>
  </div>
  <div class="slot" data-slot="2">
    <div class="blockIcon" style="background:#79502e"></div>
  </div>
  <div class="slot" data-slot="3">
    <div class="blockIcon" style="background:#858585"></div>
  </div>
</div>

<div id="help">
  WASD — Move<br>
  SPACE — Jump<br>
  LEFT CLICK — Break block<br>
  RIGHT CLICK — Place block<br>
  1 / 2 / 3 — Select block<br>
  ESC — Menu
</div>

<div id="worldButtons">
  <button class="smallButton" id="saveWorld">SAVE WORLD</button>
  <button class="smallButton" id="newWorld">NEW WORLD</button>
</div>

<div id="pickaxeHud">⛏️</div>

<script type="module">
import * as THREE from "three";

/* -------------------- BASIC SETUP -------------------- */

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 30, 85);

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  150
);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x6b6b6b, 2));

const sunlight = new THREE.DirectionalLight(0xffffff, 1.5);
sunlight.position.set(30, 50, 20);
scene.add(sunlight);

/* -------------------- MATERIALS -------------------- */

const materials = {
  grass: new THREE.MeshLambertMaterial({ color: 0x579642 }),
  dirt: new THREE.MeshLambertMaterial({ color: 0x79502e }),
  stone: new THREE.MeshLambertMaterial({ color: 0x858585 }),
  wood: new THREE.MeshLambertMaterial({ color: 0x704523 }),
  leaves: new THREE.MeshLambertMaterial({ color: 0x2d782d })
};

const blockGeometry = new THREE.BoxGeometry(1, 1, 1);
const blocks = new Map();

function key(x, y, z) {
  return `${x},${y},${z}`;
}

function addBlock(x, y, z, type) {
  const k = key(x, y, z);

  if (blocks.has(k)) return;

  const material = materials[type] || materials.stone;
  const mesh = new THREE.Mesh(blockGeometry, material);

  mesh.position.set(x, y, z);
  mesh.userData = { x, y, z, type };

  scene.add(mesh);
  blocks.set(k, mesh);
}

function removeBlock(x, y, z) {
  const k = key(x, y, z);
  const mesh = blocks.get(k);

  if (!mesh) return;

  scene.remove(mesh);
  blocks.delete(k);
}

function clearWorld() {
  for (const mesh of blocks.values()) {
    scene.remove(mesh);
  }

  blocks.clear();
}

/* -------------------- WORLD GENERATION -------------------- */

function generateWorld() {
  clearWorld();

  for (let x = -12; x <= 11; x++) {
    for (let z = -12; z <= 11; z++) {
      addBlock(x, 0, z, "grass");
      addBlock(x, -1, z, "dirt");
      addBlock(x, -2, z, "stone");
    }
  }

  // Trees
  const treePositions = [
    [-7, -6],
    [6, -7],
    [-8, 5],
    [7, 7],
    [2, -9]
  ];

  for (const [x, z] of treePositions) {
    for (let y = 1; y <= 3; y++) {
      addBlock(x, y, z, "wood");
    }

    for (let dx = -2; dx <= 2; dx++) {
      for (let dz = -2; dz <= 2; dz++) {
        for (let dy = 3; dy <= 5; dy++) {
          if (
            Math.abs(dx) + Math.abs(dz) < 4 &&
            !(dx === 0 && dz === 0 && dy < 4)
          ) {
            addBlock(x + dx, dy, z + dz, "leaves");
          }
        }
      }
    }
  }
}

/* -------------------- HUB -------------------- */

let hubMode = false;

let normalWorldSnapshot = null;
let normalPlayerPosition = null;
let normalYaw = 0;
let normalPitch = 0;

function enterHub() {
  if (hubMode) return;

  // Keep the normal world and player position in memory.
  normalWorldSnapshot = [];

  for (const mesh of blocks.values()) {
    normalWorldSnapshot.push({
      x: mesh.userData.x,
      y: mesh.userData.y,
      z: mesh.userData.z,
      type: mesh.userData.type
    });
  }

  normalPlayerPosition = camera.position.clone();
  normalYaw = yaw;
  normalPitch = pitch;

  hubMode = true;

  clearWorld();

  // 25 x 25 stone floor.
  for (let x = -12; x <= 12; x++) {
    for (let z = -12; z <= 12; z++) {
      addBlock(x, 0, z, "stone");
    }
  }

  // Perimeter walls, total height 5 blocks including floor.
  for (let y = 1; y <= 4; y++) {
    for (let i = -12; i <= 12; i++) {
      addBlock(i, y, -12, "stone");
      addBlock(i, y, 12, "stone");
      addBlock(-12, y, i, "stone");
      addBlock(12, y, i, "stone");
    }
  }

  camera.position.set(0, 2.6, 0);

  yaw = 0;
  pitch = 0;
  velocityY = 0;
  canJump = false;

  updateCameraRotation();

  status.textContent = "HUB WORLD — NOT SAVED";

  renderer.domElement.requestPointerLock();
}

function leaveHub() {
  if (!hubMode) return;

  clearWorld();

  if (normalWorldSnapshot) {
    for (const block of normalWorldSnapshot) {
      addBlock(block.x, block.y, block.z, block.type);
    }
  }

  if (normalPlayerPosition) {
    camera.position.copy(normalPlayerPosition);
  } else {
    camera.position.set(0, 2.6, 0);
  }

  yaw = normalYaw;
  pitch = normalPitch;

  velocityY = 0;
  canJump = false;

  hubMode = false;

  normalWorldSnapshot = null;
  normalPlayerPosition = null;

  updateCameraRotation();

  status.textContent = "WORLD RESTORED";
}

/* -------------------- PLAYER -------------------- */

const playerRadius = 0.3;
const playerHeight = 1.8;

let velocityY = 0;
let canJump = false;
let yaw = 0;
let pitch = 0;
let isLocked = false;

const keys = {};

const status = document.getElementById("status");
const overlay = document.getElementById("overlay");
const crosshair = document.getElementById("crosshair");
const hotbar = document.getElementById("hotbar");
const help = document.getElementById("help");
const worldButtons = document.getElementById("worldButtons");
const pickaxeHud = document.getElementById("pickaxeHud");

function updateCameraRotation() {
  camera.rotation.order = "YXZ";
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;
}

/*
  Collision uses the player's actual body bounds.
  A block only collides when the player overlaps its cube.
*/
function collidesAt(px, py, pz) {
  const minX = px - playerRadius;
  const maxX = px + playerRadius;
  const minY = py - playerHeight;
  const maxY = py;
  const minZ = pz - playerRadius;
  const maxZ = pz + playerRadius;

  for (
    let x = Math.floor(minX - 0.5);
    x <= Math.ceil(maxX + 0.5);
    x++
  ) {
    for (
      let y = Math.floor(minY - 0.5);
      y <= Math.ceil(maxY + 0.5);
      y++
    ) {
      for (
        let z = Math.floor(minZ - 0.5);
        z <= Math.ceil(maxZ + 0.5);
        z++
      ) {
        if (!blocks.has(key(x, y, z))) continue;

        const blockMinX = x - 0.5;
        const blockMaxX = x + 0.5;
        const blockMinY = y - 0.5;
        const blockMaxY = y + 0.5;
        const blockMinZ = z - 0.5;
        const blockMaxZ = z + 0.5;

        const overlapX =
          maxX > blockMinX + 0.001 &&
          minX < blockMaxX - 0.001;

        const overlapY =
          maxY > blockMinY + 0.001 &&
          minY < blockMaxY - 0.001;

        const overlapZ =
          maxZ > blockMinZ + 0.001 &&
          minZ < blockMaxZ - 0.001;

        if (overlapX && overlapY && overlapZ) {
          return true;
        }
      }
    }
  }

  return false;
}

function findLandingHeight(px, oldY, newY, pz) {
  const oldFeet = oldY - playerHeight;
  const newFeet = newY - playerHeight;

  if (newFeet >= oldFeet) return null;

  let highestTop = -Infinity;

  const minX = Math.floor(px - playerRadius - 0.5);
  const maxX = Math.ceil(px + playerRadius + 0.5);
  const minZ = Math.floor(pz - playerRadius - 0.5);
  const maxZ = Math.ceil(pz + playerRadius + 0.5);

  for (let x = minX; x <= maxX; x++) {
    for (let z = minZ; z <= maxZ; z++) {
      for (
        let y = Math.floor(newFeet - 0.5);
        y <= Math.ceil(oldFeet + 0.5);
        y++
      ) {
        if (!blocks.has(key(x, y, z))) continue;

        const top = y + 0.5;

        const overlapsX =
          px + playerRadius > x - 0.5 &&
          px - playerRadius < x + 0.5;

        const overlapsZ =
          pz + playerRadius > z - 0.5 &&
          pz - playerRadius < z + 0.5;

        if (
          overlapsX &&
          overlapsZ &&
          oldFeet >= top - 0.05 &&
          newFeet <= top &&
          top > highestTop
        ) {
          highestTop = top;
        }
      }
    }
  }

  return highestTop === -Infinity ? null : highestTop + playerHeight;
}

function updatePlayer(delta) {
  const speed = 5.5;
  const forward = new THREE.Vector3(
    -Math.sin(yaw),
    0,
    -Math.cos(yaw)
  );

  const right = new THREE.Vector3(
    Math.cos(yaw),
    0,
    -Math.sin(yaw)
  );

  const movement = new THREE.Vector3();

  if (keys["KeyW"]) movement.add(forward);
  if (keys["KeyS"]) movement.sub(forward);
  if (keys["KeyD"]) movement.add(right);
  if (keys["KeyA"]) movement.sub(right);

  if (movement.lengthSq() > 0) {
    movement.normalize().multiplyScalar(speed * delta);

    // Resolve X and Z separately so walls don't block all movement.
    const nextX = camera.position.x + movement.x;

    if (!collidesAt(nextX, camera.position.y, camera.position.z)) {
      camera.position.x = nextX;
    }

    const nextZ = camera.position.z + movement.z;

    if (!collidesAt(camera.position.x, camera.position.y, nextZ)) {
      camera.position.z = nextZ;
    }
  }

  const oldY = camera.position.y;

  velocityY -= 20 * delta;

  let nextY = oldY + velocityY * delta;

  if (velocityY <= 0) {
    const landingY = findLandingHeight(
      camera.position.x,
      oldY,
      nextY,
      camera.position.z
    );

    if (landingY !== null) {
      nextY = landingY;
      velocityY = 0;
      canJump = true;
    } else {
      canJump = false;
    }
  }

  if (velocityY > 0) {
    if (collidesAt(
      camera.position.x,
      nextY,
      camera.position.z
    )) {
      velocityY = 0;
      nextY = oldY;
    }
  }

  camera.position.y = nextY;

  // Prevent falling forever if the player leaves the world.
  if (camera.position.y < -20) {
    camera.position.set(0, 3.5, 0);
    velocityY = 0;
    canJump = false;
  }
}

/* -------------------- CONTROLS -------------------- */

document.addEventListener("keydown", (event) => {
  keys[event.code] = true;

  if (
    event.code === "Space" &&
    isLocked &&
    canJump
  ) {
    velocityY = 8;
    canJump = false;
    event.preventDefault();
  }

  if (event.code === "Digit1") selectSlot(1);
  if (event.code === "Digit2") selectSlot(2);
  if (event.code === "Digit3") selectSlot(3);
});

document.addEventListener("keyup", (event) => {
  keys[event.code] = false;
});

document.addEventListener("mousemove", (event) => {
  if (!isLocked) return;

  yaw -= event.movementX * 0.002;
  pitch -= event.movementY * 0.002;

  pitch = Math.max(
    -Math.PI / 2 + 0.01,
    Math.min(Math.PI / 2 - 0.01, pitch)
  );

  updateCameraRotation();
});

document.addEventListener("pointerlockchange", () => {
  isLocked =
    document.pointerLockElement === renderer.domElement;

  overlay.style.display = isLocked ? "none" : "flex";
  crosshair.style.display = isLocked ? "block" : "none";
  hotbar.style.display = isLocked ? "flex" : "none";
  help.style.display = isLocked ? "block" : "none";
  worldButtons.style.display = isLocked ? "block" : "none";
  pickaxeHud.style.display = isLocked ? "none" : "block";

  if (!isLocked) {
    for (const code in keys) {
      keys[code] = false;
    }

    // ESC exits the hub and restores the normal world.
    if (hubMode) {
      leaveHub();
    }
  }
});

/* -------------------- BLOCK BREAKING / PLACING -------------------- */

let selectedSlot = 1;

const blockTypes = {
  1: "grass",
  2: "dirt",
  3: "stone"
};

function selectSlot(slot) {
  selectedSlot = slot;

  document.querySelectorAll(".slot").forEach((element) => {
    element.classList.toggle(
      "selected",
      Number(element.dataset.slot) === slot
    );
  });
}

const raycaster = new THREE.Raycaster();
raycaster.far = 6;

renderer.domElement.addEventListener("contextmenu", (event) => {
  event.preventDefault();
});

renderer.domElement.addEventListener("mousedown", (event) => {
  if (!isLocked) return;

  // IMPORTANT: no breaking or placing blocks inside the hub.
  if (hubMode) return;

  if (event.button !== 0 && event.button !== 2) return;

  raycaster.setFromCamera(
    new THREE.Vector2(0, 0),
    camera
  );

  const hits = raycaster.intersectObjects(
    Array.from(blocks.values()),
    false
  );

  if (!hits.length) return;

  const hit = hits[0];
  const data = hit.object.userData;

  if (event.button === 0) {
    // Left-click: break block.
    // Don't break the block directly under the player's feet.
    if (
      data.x === Math.round(camera.position.x) &&
      data.z === Math.round(camera.position.z) &&
      data.y === Math.floor(camera.position.y - playerHeight)
    ) {
      return;
    }

    removeBlock(data.x, data.y, data.z);
    scheduleSave();
  }

  if (event.button === 2) {
    // Right-click: place block on the face that was hit.
    if (!hit.face) return;

    const normal = hit.face.normal.clone();
    normal.transformDirection(hit.object.matrixWorld);

    const x = data.x + Math.round(normal.x);
    const y = data.y + Math.round(normal.y);
    const z = data.z + Math.round(normal.z);

    if (blocks.has(key(x, y, z))) return;

    // Do not place a block inside the player's body.
    if (collidesAt(x, y + playerHeight, z)) return;

    addBlock(x, y, z, blockTypes[selectedSlot]);
    scheduleSave();
  }
});

/* -------------------- SAVE / LOAD -------------------- */

const SAVE_KEY = "voxel-world-v1";

function saveWorld() {
  if (hubMode) return false;

  const data = [];

  for (const mesh of blocks.values()) {
    data.push({
      x: mesh.userData.x,
      y: mesh.userData.y,
      z: mesh.userData.z,
      type: mesh.userData.type
    });
  }

  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    status.textContent = "WORLD SAVED";
    return true;
  } catch (error) {
    status.textContent = "SAVE FAILED";
    return false;
  }
}

let saveTimeout = null;

function scheduleSave() {
  if (hubMode) return;

  clearTimeout(saveTimeout);

  saveTimeout = setTimeout(() => {
    saveWorld();
  }, 300);
}

function loadWorld() {
  try {
    const saved = localStorage.getItem(SAVE_KEY);

    if (!saved) {
      generateWorld();
      return;
    }

    const data = JSON.parse(saved);

    if (!Array.isArray(data)) {
      generateWorld();
      return;
    }

    clearWorld();

    for (const block of data) {
      if (
        Number.isFinite(block.x) &&
        Number.isFinite(block.y) &&
        Number.isFinite(block.z)
      ) {
        addBlock(
          block.x,
          block.y,
          block.z,
          materials[block.type] ? block.type : "stone"
        );
      }
    }
  } catch (error) {
    generateWorld();
  }
}

document.getElementById("saveWorld").addEventListener("click", () => {
  if (hubMode) {
    status.textContent = "HUB CANNOT BE SAVED";
    return;
  }

  saveWorld();
});

document.getElementById("newWorld").addEventListener("click", () => {
  if (hubMode) return;

  if (confirm("Create a new world? Your current saved world will be replaced.")) {
    generateWorld();

    camera.position.set(0, 3.5, 5);
    velocityY = 0;
    canJump = false;

    saveWorld();
  }
});

window.addEventListener("beforeunload", () => {
  // Never save the temporary hub.
  if (!hubMode) {
    saveWorld();
  }
});

/* -------------------- MENU BUTTONS -------------------- */

document.getElementById("play").addEventListener("click", () => {
  // If returning from the hub, restore the normal world first.
  if (hubMode) {
    leaveHub();
  }

  if (blocks.size === 0) {
    loadWorld();
  }

  renderer.domElement.requestPointerLock();
});

document.getElementById("joinHub").addEventListener("click", () => {
  if (hubMode) return;

  enterHub();
});

/* -------------------- START -------------------- */

loadWorld();

camera.position.set(0, 3.5, 5);
updateCameraRotation();

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const delta = Math.min(clock.getDelta(), 0.05);

  if (isLocked) {
    updatePlayer(delta);
  }

  renderer.render(scene, camera);
}

animate();

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );
});
</script>

</body>
</html>
